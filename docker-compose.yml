version: '3.8'

services:
  # Основная база данных PostgreSQL
  db:
    image: postgres:16
    container_name: requify-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-requify-db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d/
      - ./backups:/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-requify-db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - requify-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Тестовая база данных PostgreSQL
  db-test:
    image: postgres:16
    container_name: requify-postgres-test
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_TEST_DB:-requify-test-db}
      - POSTGRES_USER=${POSTGRES_TEST_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_TEST_PASSWORD:-postgres}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d/
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_TEST_USER:-postgres} -d ${POSTGRES_TEST_DB:-requify-test-db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - requify-network
    profiles:
      - test
      - full
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis для кеширования и очередей
  redis:
    image: redis:7-alpine
    container_name: requify-redis
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=${APP_CONFIG__REDIS__PASSWORD:-}
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - requify-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Основное приложение
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - APP_ENV=${APP_CONFIG__ENV:-development}
    container_name: requify-app
    ports:
      - "${APP_CONFIG__PORT:-8000}:8000"
    environment:
      # Основные настройки приложения
      - APP_CONFIG__ENV=${APP_CONFIG__ENV:-development}
      - APP_CONFIG__NAME=${APP_CONFIG__NAME:-Requify}
      - APP_CONFIG__VERSION=${APP_CONFIG__VERSION:-0.1.0}
      - APP_CONFIG__API_V1_STR=${APP_CONFIG__API_V1_STR:-/api/v1}
      - APP_CONFIG__HOST=${APP_CONFIG__HOST:-0.0.0.0}
      - APP_CONFIG__PORT=${APP_CONFIG__PORT:-8000}
      - APP_CONFIG__DEBUG=${APP_CONFIG__DEBUG:-true}
      
      # Настройки основной БД
      - APP_CONFIG__DB__NAME=${POSTGRES_DB:-requify-db}
      - APP_CONFIG__DB__USER=${POSTGRES_USER:-postgres}
      - APP_CONFIG__DB__PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - APP_CONFIG__DB__HOST=db
      - APP_CONFIG__DB__PORT=5432
      - APP_CONFIG__DB__POOL_SIZE=${APP_CONFIG__DB__POOL_SIZE:-20}
      - APP_CONFIG__DB__MAX_OVERFLOW=${APP_CONFIG__DB__MAX_OVERFLOW:-10}
      - APP_CONFIG__DB__POOL_PRE_PING=${APP_CONFIG__DB__POOL_PRE_PING:-true}
      - APP_CONFIG__DB__POOL_RECYCLE=${APP_CONFIG__DB__POOL_RECYCLE:-3600}
      - APP_CONFIG__DB__ECHO=${APP_CONFIG__DB__ECHO:-false}
      - APP_CONFIG__DB__ECHO_POOL=${APP_CONFIG__DB__ECHO_POOL:-false}
      
      # Настройки тестовой БД
      - APP_CONFIG__TEST_DB__NAME=${POSTGRES_TEST_DB:-requify-test-db}
      - APP_CONFIG__TEST_DB__USER=${POSTGRES_TEST_USER:-postgres}
      - APP_CONFIG__TEST_DB__PASSWORD=${POSTGRES_TEST_PASSWORD:-postgres}
      - APP_CONFIG__TEST_DB__HOST=db-test
      - APP_CONFIG__TEST_DB__PORT=5432
      - APP_CONFIG__TEST_DB__POOL_SIZE=${APP_CONFIG__TEST_DB__POOL_SIZE:-20}
      - APP_CONFIG__TEST_DB__MAX_OVERFLOW=${APP_CONFIG__TEST_DB__MAX_OVERFLOW:-10}
      - APP_CONFIG__TEST_DB__POOL_PRE_PING=${APP_CONFIG__TEST_DB__POOL_PRE_PING:-true}
      - APP_CONFIG__TEST_DB__POOL_RECYCLE=${APP_CONFIG__TEST_DB__POOL_RECYCLE:-3600}
      - APP_CONFIG__TEST_DB__ECHO=${APP_CONFIG__TEST_DB__ECHO:-false}
      - APP_CONFIG__TEST_DB__ECHO_POOL=${APP_CONFIG__TEST_DB__ECHO_POOL:-false}
      
      # Настройки безопасности
      - APP_CONFIG__SECURITY__SECRET_KEY=${APP_CONFIG__SECURITY__SECRET_KEY:-super-secret-key-change-in-production-minimum-32-characters}
      - APP_CONFIG__SECURITY__ALGORITHM=${APP_CONFIG__SECURITY__ALGORITHM:-HS256}
      - APP_CONFIG__SECURITY__ACCESS_TOKEN_EXPIRE_MINUTES=${APP_CONFIG__SECURITY__ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      
      # Настройки CORS
      - APP_CONFIG__CORS_ORIGINS=${APP_CONFIG__CORS_ORIGINS:-["http://localhost:3000", "http://localhost:8080", "http://127.0.0.1:3000"]}
      
      # Настройки администратора
      - APP_CONFIG__ADMIN__EMAIL=${APP_CONFIG__ADMIN__EMAIL:-admin@requify.local}
      - APP_CONFIG__ADMIN__PASSWORD=${APP_CONFIG__ADMIN__PASSWORD:-admin123}
      - APP_CONFIG__ADMIN__NAME=${APP_CONFIG__ADMIN__NAME:-Admin User}
      
      # Настройки интеграций
      - APP_CONFIG__INTEGRATIONS__TESTING_SYSTEM_API_URL=${APP_CONFIG__INTEGRATIONS__TESTING_SYSTEM_API_URL:-http://localhost:8001/api/v1}
      - APP_CONFIG__INTEGRATIONS__TESTING_SYSTEM_API_KEY=${APP_CONFIG__INTEGRATIONS__TESTING_SYSTEM_API_KEY:-test-api-key-change-in-production}
      - APP_CONFIG__INTEGRATIONS__PROJECT_MANAGEMENT_API_URL=${APP_CONFIG__INTEGRATIONS__PROJECT_MANAGEMENT_API_URL:-http://localhost:8002/api/v1}
      - APP_CONFIG__INTEGRATIONS__PROJECT_MANAGEMENT_API_KEY=${APP_CONFIG__INTEGRATIONS__PROJECT_MANAGEMENT_API_KEY:-project-api-key-change-in-production}
      
      # Настройки логирования
      - APP_CONFIG__LOGGING__LEVEL=${APP_CONFIG__LOGGING__LEVEL:-INFO}
      - APP_CONFIG__LOGGING__FILE=${APP_CONFIG__LOGGING__FILE:-logs/requify.log}
      - APP_CONFIG__LOGGING__MAX_SIZE=${APP_CONFIG__LOGGING__MAX_SIZE:-10485760}
      - APP_CONFIG__LOGGING__BACKUP_COUNT=${APP_CONFIG__LOGGING__BACKUP_COUNT:-5}
      
      # Настройки Redis
      - APP_CONFIG__REDIS__HOST=redis
      - APP_CONFIG__REDIS__PORT=${APP_CONFIG__REDIS__PORT:-6379}
      - APP_CONFIG__REDIS__DB=${APP_CONFIG__REDIS__DB:-0}
      - APP_CONFIG__REDIS__PASSWORD=${APP_CONFIG__REDIS__PASSWORD:-}
      
      # Настройки Email
      - APP_CONFIG__EMAIL__SMTP_HOST=${APP_CONFIG__EMAIL__SMTP_HOST:-}
      - APP_CONFIG__EMAIL__SMTP_PORT=${APP_CONFIG__EMAIL__SMTP_PORT:-587}
      - APP_CONFIG__EMAIL__SMTP_USER=${APP_CONFIG__EMAIL__SMTP_USER:-}
      - APP_CONFIG__EMAIL__SMTP_PASSWORD=${APP_CONFIG__EMAIL__SMTP_PASSWORD:-}
      - APP_CONFIG__EMAIL__SMTP_TLS=${APP_CONFIG__EMAIL__SMTP_TLS:-true}
      - APP_CONFIG__EMAIL__SMTP_SSL=${APP_CONFIG__EMAIL__SMTP_SSL:-false}
      - APP_CONFIG__EMAIL__FROM_EMAIL=${APP_CONFIG__EMAIL__FROM_EMAIL:-noreply@requify.local}
      - APP_CONFIG__EMAIL__FROM_NAME=${APP_CONFIG__EMAIL__FROM_NAME:-Requify}
      
      # Настройки файлового хранилища
      - APP_CONFIG__FILE_STORAGE__UPLOAD_DIR=${APP_CONFIG__FILE_STORAGE__UPLOAD_DIR:-uploads}
      - APP_CONFIG__FILE_STORAGE__MAX_FILE_SIZE=${APP_CONFIG__FILE_STORAGE__MAX_FILE_SIZE:-10485760}
      - APP_CONFIG__FILE_STORAGE__ALLOWED_EXTENSIONS=${APP_CONFIG__FILE_STORAGE__ALLOWED_EXTENSIONS:-pdf,doc,docx,txt,jpg,jpeg,png,gif}
      
      # Устаревшие переменные для обратной совместимости
      - SECRET_KEY=${SECRET_KEY:-super-secret-key-change-in-production-minimum-32-characters}
      - DATABASE_URI=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-requify-db}
      - ASYNC_DATABASE_URI=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-requify-db}
      - TEST_DATABASE_URI=postgresql+psycopg2://${POSTGRES_TEST_USER:-postgres}:${POSTGRES_TEST_PASSWORD:-postgres}@db-test:5432/${POSTGRES_TEST_DB:-requify-test-db}
      - TEST_ASYNC_DATABASE_URI=postgresql+asyncpg://${POSTGRES_TEST_USER:-postgres}:${POSTGRES_TEST_PASSWORD:-postgres}@db-test:5432/${POSTGRES_TEST_DB:-requify-test-db}
      - REDIS_URL=redis://redis:6379/${APP_CONFIG__REDIS__DB:-0}
    volumes:
      - ./requify:/app
      - ./${APP_CONFIG__FILE_STORAGE__UPLOAD_DIR:-uploads}:/app/uploads
      - ./logs:/app/logs
      - ./backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - requify-network
    profiles:
      - app
      - full
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # nginx для статических файлов и reverse proxy
  nginx:
    image: nginx:alpine
    container_name: requify-nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/var/www/static:ro
      - ./${APP_CONFIG__FILE_STORAGE__UPLOAD_DIR:-uploads}:/var/www/uploads:ro
      - ./logs/nginx:/var/log/nginx
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - requify-network
    profiles:
      - nginx
      - full
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Мониторинг (дополнительно для продакшена)
  monitoring:
    image: prom/prometheus:latest
    container_name: requify-monitoring
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - requify-network
    profiles:
      - monitoring
      - production
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Backup сервис
  backup:
    image: postgres:16
    container_name: requify-backup
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    depends_on:
      - db
    networks:
      - requify-network
    profiles:
      - backup
      - production
    restart: "no"
    command: ["sh", "/backup.sh"]

volumes:
  postgres_data:
    driver: local
  postgres_test_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local

networks:
  requify-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16 