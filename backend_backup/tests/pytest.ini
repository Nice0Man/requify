[pytest]
# Минимальная версия pytest
minversion = 7.0

# Директории с тестами
testpaths = tests

# Паттерны для обнаружения тестов
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Маркеры для категоризации тестов
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, with database)
    performance: Performance and load tests (slow)
    compatibility: Model-schema compatibility tests
    edge_case: Edge case and boundary tests
    slow: Slow running tests
    async: Asynchronous tests

# Опции по умолчанию
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --disable-warnings
    --color=yes
    --durations=10
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=80

# Фильтры предупреждений
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*unclosed.*:ResourceWarning

# Логирование
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Директории для временных файлов
cache_dir = .pytest_cache
tmp_path_retention_count = 3
tmp_path_retention_policy = failed

# Параллельное выполнение (если установлен pytest-xdist)
# addopts = -n auto

# Настройки для покрытия кода
[coverage:run]
source = app
omit = 
    */tests/*
    */venv/*
    */migrations/*
    */alembic/*
    */__pycache__/*
    */node_modules/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod
