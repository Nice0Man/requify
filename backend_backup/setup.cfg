[flake8]
max-line-length = 88
extend-ignore = 
    # E203: whitespace before ':' (conflicts with black)
    E203,
    # W503: line break before binary operator (conflicts with black)
    W503,
    # E501: line too long (handled by black)
    E501,
    # F401: imported but unused (can be useful for __init__.py files)
    F401,
    # E722: do not use bare except (sometimes necessary)
    E722
exclude = 
    .git,
    __pycache__,
    .venv,
    venv,
    .env,
    env,
    build,
    dist,
    *.egg-info,
    .pytest_cache,
    htmlcov,
    .coverage,
    alembic/versions,
    scripts,
    static,
    uploads,
    logs,
    backups
per-file-ignores =
    # __init__.py files can have unused imports
    __init__.py:F401,F403
    # Test files can have longer lines and unused imports
    tests/*.py:E501,F401,F811
    # Alembic migration files
    alembic/versions/*.py:E501,F401,F811
    # Configuration files
    */config.py:E501
max-complexity = 12
docstring-convention = google
application-import-names = app
import-order-style = google

[isort]
profile = black
multi_line_output = 3
line_length = 88
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = app
known_third_party = fastapi,sqlalchemy,pydantic,alembic,uvicorn,pytest,httpx
sections = FUTURE,STDLIB,THIRDPARTY,FIRSTPARTY,LOCALFOLDER
skip = 
    .git,
    __pycache__,
    .venv,
    venv,
    .env,
    env,
    build,
    dist,
    *.egg-info,
    .pytest_cache,
    htmlcov,
    .coverage,
    alembic/versions,
    static,
    uploads,
    logs,
    backups
skip_glob = */migrations/*

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v 
    --tb=short 
    --strict-markers
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-config=setup.cfg
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests  
    unit: marks tests as unit tests
    api: marks tests as API tests
    auth: marks tests as authentication tests
    crud: marks tests as CRUD operation tests
    db: marks tests requiring database
filterwarnings =
    ignore::DeprecationWarning
    ignore::PytestUnraisableExceptionWarning
asyncio_mode = auto

[coverage:run]
source = app
omit = 
    */tests/*
    */test_*
    */__pycache__/*
    */migrations/*
    */alembic/*
    */static/*
    */uploads/*
    */logs/*
    */backups/*
    */scripts/*
    app/main.py
branch = true

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    pass
    class .*\bProtocol\):
    @(abc\.)?abstractmethod
ignore_errors = true
show_missing = true
precision = 2

[coverage:html]
directory = htmlcov

[coverage:xml]
output = coverage.xml
