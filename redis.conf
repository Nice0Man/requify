# Redis конфигурация для Requify
# Соответствует требованиям ТЗ по безопасности (п. 4.2.7)

# Основные настройки
port 6379
timeout 300
tcp-keepalive 60

# Безопасность
protected-mode no
bind 0.0.0.0
# requirepass заменится на переменную окружения

# Память и производительность
maxmemory 256mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Persistance
save 900 1
save 300 10
save 60 10000

# Снэпшоты
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Логирование
loglevel notice
logfile /data/redis.log

# Сеть
tcp-backlog 511

# Клиенты
maxclients 1000

# Репликация (для будущего масштабирования)
replica-read-only yes
replica-serve-stale-data yes

# Производительность
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# Расширенная конфигурация
lua-time-limit 5000
slowlog-log-slower-than 10000
slowlog-max-len 128 