# Alembic конфигурация

[alembic]
# Путь к файлу миграций
script_location = alembic

# Шаблон для миграций
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(slug)s

# sys.path путь, относительный к `script_location`
prepend_sys_path = .

# Обновлять справку репозитория перед каждым запуском
revision_environment = false

# output подстановки переменных
output_encoding = utf-8

sqlalchemy.url = postgresql+psycopg2://postgres:postgres@localhost/requify

[post_write_hooks]
# Пост-миграция hooks помогают с форматированием, удалением комментариев и т.п.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S 