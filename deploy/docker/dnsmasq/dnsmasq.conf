# Requify Local DNS Configuration
# dnsmasq configuration for local development

# Основные настройки
port=53
listen-address=127.0.0.1
bind-interfaces

# Отключить чтение /etc/resolv.conf
no-resolv

# Основные DNS серверы для внешних запросов  
server=8.8.8.8
server=8.8.4.4
server=1.1.1.1

# Локальные домены для разработки
domain=requify.local

# Домены для всех сервисов
address=/requify.local/127.0.0.1
address=/api.requify.local/127.0.0.1
address=/cdn.requify.local/127.0.0.1
address=/admin.requify.local/127.0.0.1
address=/docs.requify.local/127.0.0.1

# Кэширование
cache-size=1000
neg-ttl=60
local-ttl=60

# Логирование
log-queries
log-facility=/var/log/dnsmasq.log

# Безопасность
bogus-priv
domain-needed
stop-dns-rebind
rebind-localhost-ok

# DHCP отключен (только DNS)
no-dhcp-interface=