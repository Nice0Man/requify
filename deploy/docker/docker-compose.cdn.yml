version: '3.8'

services:
  # MinIO Object Storage Server
  minio:
    image: minio/minio:latest
    container_name: requify-minio
    restart: unless-stopped
    command: server /data --console-address ":9001" --address ":9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-http://localhost:9001}
      MINIO_STORAGE_CLASS_STANDARD: EC:1
    ports:
      - "9000:9000"  # MinIO API
      - "9001:9001"  # MinIO Console
    volumes:
      - minio_data:/data
      - ./minio/config:/root/.minio
    networks:
      - requify-cdn
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s

  # NGINX CDN Proxy
  nginx-cdn:
    image: nginx:alpine
    container_name: requify-nginx-cdn
    restart: unless-stopped
    depends_on:
      - minio
    ports:
      - "8080:80"    # CDN HTTP access
      - "8443:443"   # CDN HTTPS access (for future SSL)
    volumes:
      - ./nginx/cdn.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_cache:/var/cache/nginx
      - nginx_logs:/var/log/nginx
    networks:
      - requify-cdn
    environment:
      - NGINX_WORKER_PROCESSES=auto
      - NGINX_WORKER_CONNECTIONS=1024
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # MinIO Client for bucket initialization
  mc:
    image: minio/mc:latest
    container_name: requify-mc
    depends_on:
      - minio
    networks:
      - requify-cdn
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc config host add myminio http://minio:9000 admin minioadmin123) do echo '...waiting...' && sleep 1; done;
      /usr/bin/mc mb myminio/requify-uploads --ignore-existing;
      /usr/bin/mc mb myminio/requify-avatars --ignore-existing;
      /usr/bin/mc mb myminio/requify-documents --ignore-existing;
      /usr/bin/mc policy set public myminio/requify-uploads;
      /usr/bin/mc policy set public myminio/requify-avatars;
      /usr/bin/mc admin info myminio;
      exit 0;
      "

  # Redis for CDN caching metadata
  redis-cdn:
    image: redis:7-alpine
    container_name: requify-redis-cdn
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_cdn_data:/data
    networks:
      - requify-cdn
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  minio_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/data/minio

  nginx_cache:
    driver: local

  nginx_logs:
    driver: local

  redis_cdn_data:
    driver: local

networks:
  requify-cdn:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16 