# Production overrides - используется с -f docker-compose.base.yml -f docker-compose.prod.yml
services:
  postgres:
    env_file:
      - ../env/common.env
      - ../env/production.env
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} # Обязательно из переменных окружения
    command: >
      postgres 
      -c max_connections=500
      -c shared_buffers=512MB
      -c effective_cache_size=2GB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=32MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=8MB
      -c min_wal_size=2GB
      -c max_wal_size=8GB
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
        reservations:
          memory: 1G
          cpus: "0.5"

  redis:
    env_file:
      - ../env/common.env
      - ../env/production.env
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD} # Обязательно из переменных окружения
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --appendonly yes
      --appendfsync everysec
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.5"
        reservations:
          memory: 512M
          cpus: "0.25"

  minio:
    env_file:
      - ../env/common.env
      - ../env/production.env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL}
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.5"
        reservations:
          memory: 512M
          cpus: "0.25"

  backend:
    build:
      dockerfile: ../deploy/docker/backend/Dockerfile.prod
    env_file:
      - ../env/common.env
      - ../env/production.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=info
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - backend_logs:/app/logs
      - backend_uploads:/app/uploads
      # Убираем bind mount исходного кода в продакшн
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 1G
          cpus: "1.0"
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5

  frontend:
    build:
      dockerfile: ../deploy/docker/frontend/Dockerfile.prod
    env_file:
      - ../env/common.env
      - ../env/production.env
    environment:
      - NODE_ENV=production
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
      - VITE_CDN_BASE_URL=${VITE_CDN_BASE_URL}
    volumes:
      - frontend_dist:/app/dist
      # Убираем bind mount исходного кода в продакшн
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.25"

  # Production nginx override
  nginx:
    environment:
      - NGINX_ENV=production
      - NGINX_CONFIG=./nginx/nginx.prod.conf
    volumes:
      # Override для production: используем production конфигурацию
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - nginx_cache:/var/cache/nginx
      - nginx_logs:/var/log/nginx
      # SSL сертификаты для production
      - ../data/ssl:/etc/nginx/ssl:ro
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Monitoring сервисы для продакшн
  prometheus:
    image: prom/prometheus:latest
    container_name: requify_prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    networks:
      - requify-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  grafana:
    image: grafana/grafana:latest
    container_name: requify_grafana
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../monitoring/grafana:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
    networks:
      - requify-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

# Дополнительные volumes для продакшн
volumes:
  prometheus_data:
    name: requify_prometheus_data
  grafana_data:
    name: requify_grafana_data
  certbot_webroot:
    name: requify_certbot_webroot
