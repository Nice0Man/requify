version: '3.8'

services:
  # Production SMTP Relay (optional - for organizations that need internal SMTP)
  # Uncomment if you want to use a containerized SMTP relay
  # smtp-relay:
  #   image: namshi/smtp:latest
  #   container_name: requify-smtp-relay-prod
  #   environment:
  #     - RELAY_NETWORKS=:192.168.0.0/16:10.0.0.0/8
  #     - SMARTHOST_ADDRESS=your-external-smtp-server.com
  #     - SMARTHOST_PORT=587
  #     - SMARTHOST_USER=your-smtp-user
  #     - SMARTHOST_PASSWORD=your-smtp-password
  #   networks:
  #     - requify-prod-network
  #   restart: unless-stopped
  # PostgreSQL основная база данных
  postgres:
    image: postgres:16.0
    container_name: requify_postgres_prod
    environment:
      POSTGRES_DB: ${DB_NAME:-requify-db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    ports:
      - "127.0.0.1:5432:5432"  # Bind только к localhost
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - requify-prod-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-requify-db}"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    command: >
      postgres 
      -c max_connections=200
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=8MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c max_worker_processes=8
      -c max_parallel_workers_per_gather=4
      -c max_parallel_workers=8
      -c max_parallel_maintenance_workers=4
      -c log_min_duration_statement=1000
      -c log_statement=ddl

  # Redis
  redis:
    image: redis:7.2-alpine
    container_name: requify_redis_prod
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_prod_data:/data
      - ./redis.prod.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - requify-prod-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Backend FastAPI
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend.prod
    container_name: requify_backend_prod
    environment:
      - APP_CONFIG__ENV=production
      - APP_CONFIG__DB__HOST=postgres
      - APP_CONFIG__DB__PORT=5432
      - APP_CONFIG__REDIS__HOST=redis
      - APP_CONFIG__REDIS__PORT=6379
      - APP_CONFIG__REDIS__DB=0
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads:ro
      - ./.env.prod:/app/.env:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - requify-prod-network
    restart: always
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.prod
    container_name: requify_frontend_prod
    ports:
      - "127.0.0.1:3000:80"
    networks:
      - requify-prod-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: requify_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs:/var/log/nginx
      - ./uploads:/var/www/uploads:ro
      - ./static:/var/www/static:ro
    depends_on:
      - backend
      - frontend
    networks:
      - requify-prod-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: requify_prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - requify-prod-network
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: requify_grafana
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - requify-prod-network
    restart: always

volumes:
  postgres_prod_data:
    name: requify_postgres_prod_data
  redis_prod_data:
    name: requify_redis_prod_data
  prometheus_data:
    name: requify_prometheus_data
  grafana_data:
    name: requify_grafana_data

networks:
  requify-prod-network:
    name: requify_prod_network
    driver: bridge 