services:
  # PostgreSQL основная база данных
  postgres:
    image: postgres:16.0
    container_name: requify_postgres
    environment:
      POSTGRES_DB: requify-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C --auth-host=md5"
      POSTGRES_HOST_AUTH_METHOD: md5
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - requify-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d requify-db"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres 
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c max_worker_processes=8
      -c max_parallel_workers_per_gather=4
      -c max_parallel_workers=8
      -c max_parallel_maintenance_workers=4

  # PostgreSQL тестовая база данных
  postgres-test:
    image: postgres:16.0
    container_name: requify_postgres_test
    environment:
      POSTGRES_DB: requify-test-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    networks:
      - requify-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d requify-test-db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7.2-alpine
    container_name: requify_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - requify-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Object Storage для CDN
  minio:
    image: minio/minio:latest
    container_name: requify_minio
    restart: unless-stopped
    command: server /data --console-address ":9001" --address ":9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-http://localhost:9001}
      MINIO_STORAGE_CLASS_STANDARD: EC:1
    ports:
      - "9000:9000"  # MinIO API
      - "9001:9001"  # MinIO Console  
    volumes:
      - minio_data:/data
      - ./minio/config:/root/.minio
    networks:
      - requify-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s

  # Redis для CDN метаданных
  redis-cdn:
    image: redis:7-alpine
    container_name: requify_redis_cdn
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_cdn_data:/data
    networks:
      - requify-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # MinIO Client для инициализации buckets
  mc:
    image: minio/mc:latest
    container_name: requify_mc
    depends_on:
      - minio
    networks:
      - requify-network
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc config host add myminio http://minio:9000 admin minioadmin123) do echo '...waiting...' && sleep 1; done;
      /usr/bin/mc mb myminio/requify-uploads --ignore-existing;
      /usr/bin/mc mb myminio/requify-avatars --ignore-existing;
      /usr/bin/mc mb myminio/requify-documents --ignore-existing;
      /usr/bin/mc policy set public myminio/requify-uploads;
      /usr/bin/mc policy set public myminio/requify-avatars;
      /usr/bin/mc admin info myminio;
      exit 0;
      "
    profiles:
      - init

  # Основное приложение FastAPI
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: requify_app
    environment:
      - APP_CONFIG__ENV=development
      - APP_CONFIG__DB__HOST=postgres
      - APP_CONFIG__DB__PORT=5432
      - APP_CONFIG__TEST_DB__HOST=postgres-test
      - APP_CONFIG__TEST_DB__PORT=5432
      - APP_CONFIG__REDIS__HOST=redis
      - APP_CONFIG__REDIS__PORT=6379
      - APP_CONFIG__REDIS__DB=0
      - APP_CONFIG__REDIS__PASSWORD=
      # MinIO Configuration
      - APP_CONFIG__FILE_STORAGE__USE_MINIO=true
      - APP_CONFIG__FILE_STORAGE__MINIO_ENDPOINT=minio:9000
      - APP_CONFIG__FILE_STORAGE__MINIO_ACCESS_KEY=admin
      - APP_CONFIG__FILE_STORAGE__MINIO_SECRET_KEY=minioadmin123
      - APP_CONFIG__FILE_STORAGE__MINIO_SECURE=false
      - APP_CONFIG__FILE_STORAGE__CDN_ENABLED=true
      - APP_CONFIG__FILE_STORAGE__CDN_BASE_URL=http://localhost
      - APP_CONFIG__FILE_STORAGE__CDN_AVATAR_PATH=/avatars
      - APP_CONFIG__FILE_STORAGE__CDN_UPLOADS_PATH=/cdn/uploads
      - APP_CONFIG__FILE_STORAGE__CDN_DOCUMENTS_PATH=/cdn/documents
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./.env:/app/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - requify-network
    restart: unless-stopped

  # Nginx reverse proxy with CDN support
  nginx:
    image: nginx:alpine
    container_name: requify_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./logs:/var/log/nginx
      - ./uploads:/var/www/uploads
      - ./static:/var/www/static
      - nginx_cache:/var/cache/nginx
    depends_on:
      - app
      - minio
    networks:
      - requify-network
    restart: unless-stopped

  # Adminer для управления БД (опционально, для разработки)
  adminer:
    image: adminer:4.8.1
    container_name: requify_adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    networks:
      - requify-network
    profiles:
      - dev

volumes:
  postgres_data:
    name: requify_postgres_data
  postgres_test_data:
    name: requify_postgres_test_data
  redis_data:
    name: requify_redis_data
  minio_data:
    name: requify_minio_data
  redis_cdn_data:
    name: requify_redis_cdn_data
  nginx_cache:
    name: requify_nginx_cache

networks:
  requify-network:
    name: requify_network
    driver: bridge 