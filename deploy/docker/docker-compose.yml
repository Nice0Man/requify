services:
  # PostgreSQL основная база данных
  postgres:
    image: postgres:16.0
    container_name: requify_postgres
    environment:
      POSTGRES_DB: requify-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C --auth-host=md5"
      POSTGRES_HOST_AUTH_METHOD: md5
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - requify-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d requify-db"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres 
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c max_worker_processes=8
      -c max_parallel_workers_per_gather=4
      -c max_parallel_workers=8
      -c max_parallel_maintenance_workers=4

  # PostgreSQL тестовая база данных
  postgres-test:
    image: postgres:16.0
    container_name: requify_postgres_test
    environment:
      POSTGRES_DB: requify-test-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    networks:
      - requify-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d requify-test-db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7.2-alpine
    container_name: requify_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - requify-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Основное приложение FastAPI
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: requify_app
    environment:
      - APP_CONFIG__ENV=development
      - APP_CONFIG__DB__HOST=postgres
      - APP_CONFIG__DB__PORT=5432
      - APP_CONFIG__TEST_DB__HOST=postgres-test
      - APP_CONFIG__TEST_DB__PORT=5432
      - APP_CONFIG__REDIS__HOST=redis
      - APP_CONFIG__REDIS__PORT=6379
      - APP_CONFIG__REDIS__DB=0
      - APP_CONFIG__REDIS__PASSWORD=
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./.env:/app/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - requify-network
    restart: unless-stopped

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: requify_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./logs:/var/log/nginx
      - ./uploads:/var/www/uploads
      - ./static:/var/www/static
    depends_on:
      - app
    networks:
      - requify-network
    restart: unless-stopped

  # Adminer для управления БД (опционально, для разработки)
  adminer:
    image: adminer:4.8.1
    container_name: requify_adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    networks:
      - requify-network
    profiles:
      - dev

volumes:
  postgres_data:
    name: requify_postgres_data
  postgres_test_data:
    name: requify_postgres_test_data
  redis_data:
    name: requify_redis_data

networks:
  requify-network:
    name: requify_network
    driver: bridge 