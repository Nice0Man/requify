# Основной compose файл - использует base конфигурацию
# Для разработки: docker-compose up (автоматически подключает override.yml)  
# Для продакшн: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up

include:
  - docker-compose.base.yml

# Дополнительные настройки по умолчанию (если нужны)
services:
  nginx:
    ports:
      - "80:80"
      - "443:443"