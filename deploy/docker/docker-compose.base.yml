# Базовая конфигурация сервисов для всех окружений
services:
  # PostgreSQL основная база данных
  postgres:
    image: postgres:16.0
    container_name: requify_postgres
    environment:
      POSTGRES_DB: requify_dev
      POSTGRES_USER: requify_user
      POSTGRES_PASSWORD: requify_password
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - requify-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U requify_user -d requify_dev"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    env_file:
      - ../env/common.env

  # Redis для кэширования и очередей
  redis:
    image: redis:7.2-alpine
    container_name: requify_redis
    env_file:
      - ../env/common.env
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD:-redis123}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - requify-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: requify_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-http://admin.requify.local}
    command: server /data --console-address ":9001" --address ":9000"
    volumes:
      - minio_data:/data
    networks:
      - requify-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://minio:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Backend API service
  backend:
    build:
      context: ../../
      dockerfile: backend/Dockerfile.dev
    image: docker-backend
    container_name: requify_backend
    env_file:
      - ../env/common.env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/requify-db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-admin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin123}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-secret-key-here}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-true}
    volumes:
      - backend_logs:/app/logs
      - backend_uploads:/app/uploads
    networks:
      - requify-network
    depends_on:
      - postgres
      - redis
      - minio
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://backend:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Frontend React application
  frontend:
    build:
      context: ../../
      dockerfile: frontend/Dockerfile.dev
    image: docker-frontend
    container_name: requify_frontend
    env_file:
      - ../env/common.env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - REACT_APP_API_URL=${REACT_APP_API_URL:-http://api.requify.local}
      - REACT_APP_CDN_URL=${REACT_APP_CDN_URL:-http://cdn.requify.local}
      - GENERATE_SOURCEMAP=${GENERATE_SOURCEMAP:-true}
    volumes:
      - frontend_dist:/app/dist
    networks:
      - requify-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # DNS сервер для локальных доменов
  dnsmasq:
    build:
      context: ./dnsmasq
    container_name: requify_dnsmasq
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    volumes:
      - dns_logs:/var/log
    networks:
      - requify-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nslookup", "requify.local", "127.0.0.1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: requify_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Dynamic config selection via environment variable
      - ${NGINX_CONFIG:-./nginx/nginx.conf}:/etc/nginx/nginx.conf:ro
      - nginx_cache:/var/cache/nginx
      - nginx_logs:/var/log/nginx
    networks:
      - requify-network
    depends_on:
      - dnsmasq
      - backend
      - frontend
      - minio
    environment:
      - NGINX_ENVSUBST_TEMPLATE_DIR=/etc/nginx/templates
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx/conf.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Общие volumes для всех окружений
volumes:
  postgres_data:
    name: requify_postgres_data
  redis_data:
    name: requify_redis_data
  minio_data:
    name: requify_minio_data
  backend_logs:
    name: requify_backend_logs
  backend_uploads:
    name: requify_backend_uploads
  frontend_node_modules:
    name: requify_frontend_node_modules
  frontend_dist:
    name: requify_frontend_dist
  nginx_logs:
    name: requify_nginx_logs
  nginx_cache:
    name: requify_nginx_cache
  dns_logs:
    name: requify_dnsmasq_logs

# Общая сеть
networks:
  requify-network:
    name: requify_network
    driver: bridge
