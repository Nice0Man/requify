services:
  # PostgreSQL основная база данных
  postgres:
    image: postgres:15-alpine
    container_name: requify-postgres-dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: requify_dev
      POSTGRES_USER: requify_user
      POSTGRES_PASSWORD: requify_password
    volumes:
      - "postgres_data:/var/lib/postgresql/data"
    networks:
      - requify-dev-network

  # PostgreSQL тестовая база данных
  postgres-test:
    image: postgres:16.0
    container_name: requify_postgres_test_dev
    environment:
      POSTGRES_DB: requify-test-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_dev_data:/var/lib/postgresql/data
    networks:
      - requify-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d requify-test-db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:alpine
    container_name: requify-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - "redis_data:/data"
    networks:
      - requify-dev-network

  # MinIO Object Storage для CDN
  minio:
    image: minio/minio:latest
    container_name: requify-minio-dev
    restart: unless-stopped
    command: server /data --console-address ":9001" --address ":9000"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: minioadmin123
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
      # Removed MINIO_STORAGE_CLASS_STANDARD: EC:1 for single-node deployment
    ports:
      - "9000:9000"  # MinIO API
      - "9001:9001"  # MinIO Console  
    volumes:
      - minio_dev_data:/data
    networks:
      - requify-dev-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 5s bash -c '</dev/tcp/localhost/9000' || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s

  # Redis для CDN метаданных
  redis-cdn:
    image: redis:7-alpine
    container_name: requify-redis-cdn-dev
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_cdn_dev_data:/data
    networks:
      - requify-dev-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # MinIO Client для инициализации buckets
  mc:
    image: minio/mc:latest
    container_name: requify-mc-dev
    depends_on:
      - minio
    networks:
      - requify-dev-network
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://minio:9000 admin minioadmin123) do echo '...waiting...' && sleep 1; done;
      /usr/bin/mc mb myminio/requify-uploads --ignore-existing;
      /usr/bin/mc mb myminio/requify-avatars --ignore-existing;
      /usr/bin/mc mb myminio/requify-documents --ignore-existing;
      /usr/bin/mc anonymous set public myminio/requify-uploads;
      /usr/bin/mc anonymous set public myminio/requify-avatars;
      /usr/bin/mc admin info myminio;
      exit 0;
      "
    profiles:
      - init

  # Backend FastAPI с hot reload
  backend:
    build:
      context: ../../
      dockerfile: ./deploy/docker/backend/Dockerfile.dev
    container_name: requify-backend-dev
    ports:
      - "8000:8000"
    environment:
      - APP_CONFIG__ENV=development
      - APP_CONFIG__DB__HOST=postgres
      - APP_CONFIG__DB__PORT=5432
      - APP_CONFIG__DB__NAME=requify_dev
      - APP_CONFIG__DB__USER=requify_user
      - APP_CONFIG__DB__PASSWORD=requify_password
      - APP_CONFIG__REDIS__HOST=redis
      - APP_CONFIG__REDIS__PORT=6379
      - APP_CONFIG__REDIS__DB=0
      # Email Configuration - MailHog
      - APP_CONFIG__EMAIL__SMTP_HOST=mailhog
      - APP_CONFIG__EMAIL__SMTP_PORT=1025
      - APP_CONFIG__EMAIL__SMTP_USER=
      - APP_CONFIG__EMAIL__SMTP_PASSWORD=
      - APP_CONFIG__EMAIL__SMTP_TLS=false
      - APP_CONFIG__EMAIL__SMTP_SSL=false
      - APP_CONFIG__EMAIL__FROM_EMAIL=noreply@requify.local
      - APP_CONFIG__EMAIL__FROM_NAME=Requify Development
      # MinIO & CDN Configuration
      - APP_CONFIG__FILE_STORAGE__USE_MINIO=true
      - APP_CONFIG__FILE_STORAGE__MINIO_ENDPOINT=minio:9000
      - APP_CONFIG__FILE_STORAGE__MINIO_ACCESS_KEY=admin
      - APP_CONFIG__FILE_STORAGE__MINIO_SECRET_KEY=minioadmin123
      - APP_CONFIG__FILE_STORAGE__MINIO_SECURE=false
      - APP_CONFIG__FILE_STORAGE__CDN_ENABLED=true
      - APP_CONFIG__FILE_STORAGE__CDN_BASE_URL=http://localhost
      - APP_CONFIG__FILE_STORAGE__CDN_AVATAR_PATH=/avatars
      - APP_CONFIG__FILE_STORAGE__CDN_UPLOADS_PATH=/cdn/uploads
      - APP_CONFIG__FILE_STORAGE__CDN_DOCUMENTS_PATH=/cdn/documents
      # Auth0 OAuth2 Configuration (демо для разработки)
      - APP_CONFIG__AUTH0__ENABLED=false
      - APP_CONFIG__AUTH0__DOMAIN=localhost
      - APP_CONFIG__AUTH0__CLIENT_ID=demo-local-client-id
      - APP_CONFIG__AUTH0__CLIENT_SECRET=demo-local-client-secret
      - APP_CONFIG__AUTH0__AUDIENCE=https://api.requify.com
      - APP_CONFIG__AUTH0__MANAGEMENT_CLIENT_ID=demo-management-client-id
      - APP_CONFIG__AUTH0__MANAGEMENT_CLIENT_SECRET=demo-management-client-secret
      - PYTHONPATH=/app
      - FASTAPI_ENV=development
      - DATABASE_URL=postgresql://requify_user:requify_password@postgres:5432/requify_dev
      - REDIS_URL=redis://redis:6379/0
      - APP_CONFIG__LOGGING__FILE=/app/logs/requify.log
    volumes:
      - "../../backend:/app"
      - "static_volume:/app/static"
      - "uploads_volume:/app/uploads"
      - "backend_logs:/app/logs"
    depends_on:
      - postgres
      - redis
      - minio
      - mailhog
    networks:
      - requify-dev-network
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend с hot reload
  frontend:
    build:
      context: ../../frontend
      dockerfile: ../deploy/docker/frontend/Dockerfile.dev
    container_name: requify-frontend-dev
    volumes:
      - "../../frontend:/app:delegated"
      - "frontend_node_modules:/app/node_modules"  # Named volume to preserve node_modules
      - "frontend_dist:/app/dist"          # Named volume for build artifacts
      - "frontend_vite_cache:/app/.vite"   # Named volume for Vite cache
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost/api/v1
      - NODE_ENV=development
      - VITE_HMR_PORT=3000
      - VITE_HMR_HOST=localhost
      # Auth0 OAuth2 Configuration (демо для разработки - ОТКЛЮЧЕНО)
      - REACT_APP_AUTH0_DOMAIN=localhost
      - REACT_APP_AUTH0_CLIENT_ID=demo-local-client-id
      - REACT_APP_AUTH0_AUDIENCE=https://api.requify.com
    networks:
      - requify-dev-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s  # Give more time for initial package installation
    restart: unless-stopped
    # Command to ensure packages are installed and then start dev server
    command: >
      sh -c "
      echo 'Installing npm packages...' &&
      npm install --no-fund --loglevel=error &&
      echo 'Starting Vite dev server...' &&
      npm run dev -- --host 0.0.0.0 --port 3000
      "

  # Nginx для разработки
  nginx:
    image: nginx:alpine
    container_name: requify-nginx-dev
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "../nginx/dev.conf:/etc/nginx/nginx.conf:ro"
      - "../nginx/ssl:/etc/nginx/ssl:ro"
      - "static_volume:/var/www/static"
      - "uploads_volume:/var/www/uploads"
    depends_on:
      - backend
      - frontend
    networks:
      - requify-dev-network

  # Adminer для управления БД
  adminer:
    image: adminer:4.8.1
    container_name: requify_adminer_dev
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    networks:
      - requify-dev-network

  # MailHog для тестирования email
  mailhog:
    image: mailhog/mailhog:latest
    container_name: requify_mailhog_dev
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - requify-dev-network

volumes:
  postgres_data:
    name: requify_postgres_dev_data
  postgres_test_dev_data:
    name: requify_postgres_test_dev_data
  redis_data:
    name: requify_redis_dev_data
  minio_dev_data:
    name: requify_minio_dev_data
  redis_cdn_dev_data:
    name: requify_redis_cdn_dev_data
  static_volume:
    name: requify_static_dev_data
  uploads_volume:
    name: requify_uploads_dev_data
  backend_logs:
    name: requify_backend_logs_dev
  backend_uploads:
    name: requify_backend_uploads_dev
  nginx_logs:
    name: requify_nginx_logs_dev
  frontend_node_modules:
    name: requify_frontend_node_modules_dev
  frontend_dist:
    name: requify_frontend_dist_dev
  frontend_vite_cache:
    name: requify_frontend_vite_cache_dev

networks:
  requify-dev-network:
    name: requify_dev_network
    driver: bridge 