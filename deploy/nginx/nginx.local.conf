# Nginx configuration for Requify local development with DNS setup
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # Basic settings
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Performance settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 16M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Rate limiting zones - более мягкие для development
    limit_req_zone $binary_remote_addr zone=global:10m rate=1000r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=500r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=100r/s;
    
    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # CDN access control
    map $arg_key $cdn_access {
        default "deny";
        "dev-access-key-123" "allow";
        "prod-access-key-456" "allow";
    }

    # Upstream definitions
    upstream backend_upstream {
        server backend:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream frontend_upstream {
        server frontend:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream minio_upstream {
        server minio:9000 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # Caching
    proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static_cache:10m max_size=100m inactive=60m use_temp_path=off;
    proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m max_size=50m inactive=10m use_temp_path=off;

    # API Gateway - api.requify.local
    server {
        listen 80;
        server_name api.requify.local;
        
        # Rate limiting (очень мягкие для dev)
        limit_req zone=global burst=1000 nodelay;
        limit_conn addr 1000;

        # All API requests go to FastAPI backend
        location / {
            # CORS headers for all requests
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With, Accept, Origin, Cache-Control, X-File-Name' always;
            add_header 'Access-Control-Max-Age' 1728000 always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            
            # Handle preflight OPTIONS requests
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With, Accept, Origin, Cache-Control, X-File-Name' always;
                add_header 'Access-Control-Max-Age' 1728000 always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Content-Type' 'text/plain; charset=utf-8' always;
                add_header 'Content-Length' 0 always;
                return 204;
            }
            
            # Security headers
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # CDN Server - cdn.requify.local
    server {
        listen 80;
        server_name cdn.requify.local;
        
        # Rate limiting (очень мягкие для dev)
        limit_req zone=global burst=1000 nodelay;
        limit_conn addr 1000;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 '{"status":"healthy","service":"cdn"}';
            add_header Content-Type application/json;
        }

        # MinIO Admin Console
        location /admin/ {
            proxy_pass http://minio_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-NginX-Proxy true;
            proxy_ssl_session_reuse off;
            proxy_redirect off;
        }

        # Public avatars - publicly accessible
        location /avatars/ {
            proxy_pass http://minio_upstream/requify-avatars/;
            
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Caching for avatar files
            proxy_cache static_cache;
            proxy_cache_valid 200 304 24h;
            proxy_cache_valid 404 1m;
            proxy_cache_key $uri$is_args$args;
            
            # CDN headers for avatars
            add_header Cache-Control "public, max-age=86400" always;
            add_header X-Cache-Status $upstream_cache_status always;
            
            # CORS for public assets
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Range' always;
        }

        # Public images/uploads - publicly accessible
        location /images/ {
            proxy_pass http://minio_upstream/requify-uploads/images/;
            
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Caching for images
            proxy_cache static_cache;
            proxy_cache_valid 200 304 24h;
            proxy_cache_valid 404 1m;
            proxy_cache_key $uri$is_args$args;
            
            # CDN headers for images
            add_header Cache-Control "public, max-age=86400" always;
            add_header X-Cache-Status $upstream_cache_status always;
            
            # CORS for public assets
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Range' always;
        }

        # Public uploads - publicly accessible
        location /uploads/ {
            proxy_pass http://minio_upstream/requify-uploads/;
            
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Caching for uploads
            proxy_cache static_cache;
            proxy_cache_valid 200 304 6h;
            proxy_cache_valid 404 1m;
            proxy_cache_key $uri$is_args$args;
            
            # CDN headers for uploads
            add_header Cache-Control "public, max-age=21600" always;
            add_header X-Cache-Status $upstream_cache_status always;
            
            # CORS for public assets
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Range' always;
        }

        # Public documents - publicly accessible
        location /documents/ {
            proxy_pass http://minio_upstream/requify-documents/;
            
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Caching for documents
            proxy_cache static_cache;
            proxy_cache_valid 200 304 1h;
            proxy_cache_valid 404 1m;
            proxy_cache_key $uri$is_args$args;
            
            # CDN headers for documents
            add_header Cache-Control "public, max-age=3600" always;
            add_header X-Cache-Status $upstream_cache_status always;
            
            # CORS for public assets
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Range' always;
        }

        # Public content (legacy path - for backward compatibility)
        location /public/ {
            # Legacy support - redirect to appropriate bucket based on path
            location /public/avatars/ {
                proxy_pass http://minio_upstream/requify-avatars/;
            }
            location /public/uploads/ {
                proxy_pass http://minio_upstream/requify-uploads/;
            }
            location /public/documents/ {
                proxy_pass http://minio_upstream/requify-documents/;
            }
            
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Caching for public content
            proxy_cache static_cache;
            proxy_cache_valid 200 304 1h;
            proxy_cache_valid 404 1m;
            proxy_cache_key $uri$is_args$args;
            
            # CDN headers
            add_header Cache-Control "public, max-age=3600" always;
            add_header X-Cache-Status $upstream_cache_status always;
            
            # CORS for public assets
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Range' always;
        }

        # Protected content (requires access key)
        location /protected/ {
            # Access control
            if ($cdn_access = "deny") {
                return 403 "Access denied. Valid key required.";
            }
            
            proxy_pass http://minio_upstream/requify-protected/;
            
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Caching for protected content
            proxy_cache static_cache;
            proxy_cache_valid 200 304 30m;
            proxy_cache_key $uri$is_args$args$cdn_access;
            
            # CDN headers
            add_header Cache-Control "private, max-age=1800" always;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        # Default root path - show CDN info
        location = / {
            return 200 '{"service":"Requify CDN","status":"available","buckets":{"avatars":"requify-avatars","uploads":"requify-uploads","documents":"requify-documents"},"endpoints":["/health","/avatars/","/uploads/","/images/","/documents/","/public/","/protected/","/admin/"],"example_urls":["http://cdn.requify.local/avatars/users/5/2025/07/29/avatars_256x256_3a4472a1-068f-45fa-822e-3e162f59be04.png","http://cdn.requify.local/uploads/projects/123/requirements.pdf","http://cdn.requify.local/documents/specs/project-spec.docx"]}';
            add_header Content-Type application/json;
        }

        # Catch-all for any other requests that don't match specific locations
        location / {
            return 404 '{"error":"Not Found","message":"File not found on CDN"}';
            add_header Content-Type application/json;
        }
    }

    # Frontend Server - requify.local (main app)
    server {
        listen 80;
        server_name requify.local;
        
        # Rate limiting (очень мягкие для dev режима)
        limit_req zone=global burst=1000 nodelay;
        limit_conn addr 1000;

        # All requests go to Vite dev server
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            # Frontend security headers
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }
    }

    # Admin Panel - admin.requify.local
    server {
        listen 80;
        server_name admin.requify.local;
        
        location / {
            proxy_pass http://adminer:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Admin security headers
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
        }
    }

    # Documentation - docs.requify.local
    server {
        listen 80;
        server_name docs.requify.local;
        
        # OpenAPI JSON specification
        location /openapi.json {
            proxy_pass http://backend_upstream/openapi.json;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Allow CORS for docs
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type' always;
        }
        
        # ReDoc documentation
        location /redoc {
            proxy_pass http://backend_upstream/redoc;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Swagger UI documentation (default)
        location / {
            proxy_pass http://backend_upstream/docs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Docs security headers
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
        }
    }
}