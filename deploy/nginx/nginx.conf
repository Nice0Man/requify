worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Логирование
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Основные настройки
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Лимиты загрузки файлов
    client_max_body_size 100M;
    client_body_buffer_size 1M;
    client_header_buffer_size 8k;
    large_client_header_buffers 4 8k;

    # Cache settings for CDN
    proxy_cache_path /var/cache/nginx/cdn 
                     levels=1:2 
                     keys_zone=cdn_cache:100m 
                     max_size=1g 
                     inactive=60m 
                     use_temp_path=off;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=assets:10m rate=50r/s;

    # Upstream серверы
    upstream requify_backend {
        server app:8000;
        keepalive 32;
    }

    upstream requify_frontend {
        server frontend:3000;
        keepalive 16;
    }

    # MinIO object storage upstream
    upstream minio_backend {
        least_conn;
        server minio:9000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Основной сервер - API Gateway
    server {
        listen 80;
        server_name localhost;

        # Логи для основного сервера
        access_log /var/log/nginx/requify_access.log main;
        error_log /var/log/nginx/requify_error.log;

        # Общие CORS заголовки для всех запросов
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, X-Requested-With, X-Forwarded-For, X-Forwarded-Proto' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range, Content-Disposition' always;

        # Обработка CORS preflight запросов
        location ~* "^.+\\.(ico|css|js|gif|jpe?g|png|svg|woff2?|ttf|eot)$" {
            proxy_pass http://requify_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            add_header 'Access-Control-Allow-Origin' '*' always;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # CORS preflight запросы
        location / {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, X-Requested-With, X-Forwarded-For, X-Forwarded-Proto' always;
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            # Frontend приложение
            proxy_pass http://requify_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # CORS заголовки для основных запросов
            add_header 'Access-Control-Allow-Origin' '*' always;
            
            # Таймауты
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # API маршруты с CORS
        location /api/ {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, X-Requested-With, X-Forwarded-For, X-Forwarded-Proto' always;
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            limit_req zone=api burst=20 nodelay;

            proxy_pass http://requify_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # CORS заголовки для API
            add_header 'Access-Control-Allow-Origin' '*' always;
            
            # Таймауты для API
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Буферизация
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # === CDN Routes for MinIO Object Storage (Production) ===
        
        # CDN общий префикс для всех статических ресурсов
        location /cdn/ {
            # Avatar images - long cache for production
            location /cdn/avatars/ {
                proxy_pass http://minio_backend/requify-avatars/;
                                 proxy_cache cdn_cache;
                proxy_cache_valid 200 304 1h;
                proxy_cache_valid 404 10m;
                proxy_cache_key "$scheme$request_method$host$request_uri";
                
                # Headers
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                
                # Response headers
                add_header X-Cache-Status $upstream_cache_status;
                add_header Cache-Control "public, max-age=3600";
                add_header X-CDN-Provider "requify-cdn";
                
                # Security headers
                add_header X-Content-Type-Options "nosniff";
                add_header X-Frame-Options "DENY";
            }

            # General uploads - medium cache for production
            location /cdn/uploads/ {
                proxy_pass http://minio_backend/requify-uploads/;
                                 proxy_cache cdn_cache;
                proxy_cache_valid 200 304 30m;
                proxy_cache_valid 404 10m;
                proxy_cache_key "$scheme$request_method$host$request_uri";
                
                # Headers
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                
                # Response headers
                add_header X-Cache-Status $upstream_cache_status;
                add_header Cache-Control "public, max-age=1800";
                add_header X-CDN-Provider "requify-cdn";
                
                # Security headers
                add_header X-Content-Type-Options "nosniff";
                add_header X-Frame-Options "DENY";
            }

            # Documents - access control for production
            location /cdn/documents/ {
                # Authentication required for documents in production
                auth_request /auth;
                
                proxy_pass http://minio_backend/requify-documents/;
                
                # Headers
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                
                # Response headers
                add_header Cache-Control "private, no-cache, no-store, must-revalidate";
                add_header X-CDN-Provider "requify-cdn";
                
                # Enhanced security headers
                add_header X-Content-Type-Options "nosniff";
                add_header X-Frame-Options "DENY";
                add_header X-XSS-Protection "1; mode=block";
            }

            # Static assets (CSS, JS, fonts, etc.) - long cache for production
            location /cdn/static/ {
                proxy_pass http://minio_backend/requify-static/;
                                 proxy_cache cdn_cache;
                proxy_cache_valid 200 304 1d;
                proxy_cache_valid 404 1h;
                proxy_cache_key "$scheme$request_method$host$request_uri";
                
                # Headers
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                
                # Response headers
                add_header X-Cache-Status $upstream_cache_status;
                add_header Cache-Control "public, max-age=86400, immutable";
                add_header X-CDN-Provider "requify-cdn";
                
                # MIME type optimization
                location ~* \.(css|js)$ {
                    expires 7d;
                    add_header Cache-Control "public, max-age=604800, immutable";
                }
                
                location ~* \.(woff|woff2|ttf|eot)$ {
                    expires 90d;
                    add_header Cache-Control "public, max-age=7776000, immutable";
                }
                
                location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
                    expires 30d;
                    add_header Cache-Control "public, max-age=2592000, immutable";
                }
            }

            # Images (общие изображения, не аватары) - long cache for production
            location /cdn/images/ {
                proxy_pass http://minio_backend/requify-images/;
                                 proxy_cache cdn_cache;
                proxy_cache_valid 200 304 6h;
                proxy_cache_valid 404 1h;
                proxy_cache_key "$scheme$request_method$host$request_uri";
                
                # Headers
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                
                # Response headers
                add_header X-Cache-Status $upstream_cache_status;
                add_header Cache-Control "public, max-age=21600";
                add_header X-CDN-Provider "requify-cdn";
                
                # Security headers
                add_header X-Content-Type-Options "nosniff";
                add_header X-Frame-Options "DENY";
            }
        }
        
        # Backward compatibility: redirect old /avatars/ to /cdn/avatars/
        location /avatars/ {
            return 301 /cdn/avatars/$is_args$args;
        }

        # Cache status endpoint
        location /cache-status {
            access_log off;
            add_header Content-Type application/json;
            add_header 'Access-Control-Allow-Origin' '*' always;
            return 200 '{"cache_path":"/var/cache/nginx/cdn","cache_zone":"cdn_cache"}';
        }

        # Документация API (лучшая практика: /docs)
        location /docs {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, X-Requested-With, X-Forwarded-For, X-Forwarded-Proto' always;
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            proxy_pass http://requify_backend/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # CORS заголовки
            add_header 'Access-Control-Allow-Origin' '*' always;
            
            # Кэширование для статики документации
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
                expires 1h;
                add_header Cache-Control "public";
            }
        }

        # Интерактивная документация API (Swagger UI)
        location /redoc {
            proxy_pass http://requify_backend/redoc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            add_header 'Access-Control-Allow-Origin' '*' always;
        }

        # OpenAPI схема
        location /openapi.json {
            proxy_pass http://requify_backend/openapi.json;
            proxy_set_header Host $host;
            
            # CORS заголовки
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Content-Type' 'application/json';
            
            # Кэширование схемы
            expires 1h;
            add_header Cache-Control "public";
        }

        # Проверка здоровья
        location /health {
            proxy_pass http://requify_backend/health;
            proxy_set_header Host $host;
            access_log off;
            
            add_header 'Access-Control-Allow-Origin' '*' always;
        }

        # Статические файлы бэкенда
        location /static/ {
            proxy_pass http://requify_backend/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header 'Access-Control-Allow-Origin' '*' always;
        }

        # Загруженные файлы
        location /uploads/ {
            proxy_pass http://requify_backend/uploads/;
            expires 7d;
            add_header Cache-Control "public";
            add_header 'Access-Control-Allow-Origin' '*' always;
        }

        # Медиа файлы
        location /media/ {
            proxy_pass http://requify_backend/media/;
            expires 7d;
            add_header Cache-Control "public";
            add_header 'Access-Control-Allow-Origin' '*' always;
        }

        # Обработка ошибок
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;

        location = /404.html {
            proxy_pass http://requify_frontend/404;
        }

        location = /50x.html {
            proxy_pass http://requify_frontend/500;
        }

        # Дополнительные заголовки безопасности
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
} 