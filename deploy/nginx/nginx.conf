user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Оптимизация для высокой нагрузки
worker_rlimit_nofile 8192;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Формат логирования
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    # Логирование CDN запросов
    log_format cdn_format '$remote_addr - $remote_user [$time_local] "$request" '
                         '$status $body_bytes_sent "$http_referer" '
                         '"$http_user_agent" "cdn_key=$arg_key" '
                         'cache_status=$upstream_cache_status';

    access_log /var/log/nginx/access.log main;

    # Основные настройки
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;
    types_hash_max_size 2048;
    server_tokens off;

    # Лимиты загрузки файлов
    client_max_body_size 100M;
    client_body_buffer_size 1M;
    client_header_buffer_size 8k;
    large_client_header_buffers 4 8k;

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        application/x-font-ttf
        application/vnd.ms-fontobject
        font/opentype;

    # Настройки кэша для CDN
    proxy_cache_path /var/cache/nginx/cdn 
                     levels=1:2 
                     keys_zone=cdn_cache:200m 
                     max_size=2g 
                     inactive=120m 
                     use_temp_path=off;

    # Кэш для статических файлов
    proxy_cache_path /var/cache/nginx/static 
                     levels=1:2 
                     keys_zone=static_cache:100m 
                     max_size=1g 
                     inactive=60m 
                     use_temp_path=off;

    # Ограничения скорости
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=cdn_protected:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=cdn_public:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=frontend:10m rate=50r/s;

    # Ограничения соединений
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    # Карта для проверки CDN ключей
    map $arg_key $cdn_access_allowed {
        default 0;
        "~^[a-zA-Z0-9]{32}$" 1;  # Проверка формата ключа (32 символа)
    }

    # Проверка валидности CDN ключа
    map $arg_key $valid_cdn_key {
        default 0;
        # Добавьте здесь валидные ключи
        "requify_cdn_key_2024_production" 1;
        "requify_dev_access_key_temp_2024" 1;
        # Можно добавить больше ключей по необходимости
    }

    # Upstream серверы
    upstream requify_backend {
        least_conn;
        server backend:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream requify_frontend {
        server frontend:3000 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # MinIO object storage upstream
    upstream minio_backend {
        least_conn;
        server minio:9000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Основной сервер
    server {
        listen 80;
        server_name _;

        # Логи
        access_log /var/log/nginx/requify_access.log main;
        error_log /var/log/nginx/requify_error.log;

        # Ограничения соединений
        limit_conn perip 20;

        # Заголовки безопасности
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' wss: ws:;" always;

        # === API маршруты ===
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            
            # CORS обработка
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, X-Requested-With, X-Forwarded-For, X-Forwarded-Proto' always;
                add_header 'Access-Control-Max-Age' 86400;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            proxy_pass http://requify_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # CORS заголовки
            add_header 'Access-Control-Allow-Origin' '*' always;
            
            # Таймауты
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Буферизация
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 16 8k;
        }

        # === CDN маршруты с защитой ===
        location /cdn/ {
            access_log /var/log/nginx/cdn_access.log cdn_format;
            
            # Общая защита для всех CDN маршрутов (кроме публичного контента)
            location ~ ^/cdn/(?!public/|avatars/|static/).*$ {
                # Проверка наличия ключа
                if ($valid_cdn_key = 0) {
                    return 403 '{"error":"Access Denied","message":"Valid CDN key required"}';
                }
                
                limit_req zone=cdn_protected burst=10 nodelay;
                
                # Проксирование к MinIO
                rewrite ^/cdn/(.*)$ /$1 break;
                proxy_pass http://minio_backend/requify-protected/;
                
                # Кэширование защищенного контента
                proxy_cache cdn_cache;
                proxy_cache_valid 200 304 30m;
                proxy_cache_valid 404 5m;
                proxy_cache_key "$scheme$request_method$host$request_uri$arg_key";
                
                # Заголовки
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                
                # Заголовки ответа
                add_header X-Cache-Status $upstream_cache_status;
                add_header Cache-Control "private, max-age=1800";
                add_header X-CDN-Provider "requify-cdn";
                add_header X-Content-Type-Options "nosniff";
                add_header X-Frame-Options "DENY";
            }

            # Публичные аватары - без защиты
            location /cdn/avatars/ {
                limit_req zone=cdn_public burst=200 nodelay;
                
                proxy_pass http://minio_backend/requify-avatars/;
                proxy_cache cdn_cache;
                proxy_cache_valid 200 304 2h;
                proxy_cache_valid 404 10m;
                proxy_cache_key "$scheme$request_method$host$request_uri";
                
                # Заголовки
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                
                # Заголовки ответа
                add_header X-Cache-Status $upstream_cache_status;
                add_header Cache-Control "public, max-age=7200";
                add_header X-CDN-Provider "requify-cdn";
                
                # Оптимизация изображений
                location ~* \.(jpg|jpeg|png|webp|gif)$ {
                    expires 7d;
                    add_header Cache-Control "public, immutable";
                    add_header Vary "Accept-Encoding";
                }
            }

            # Статические файлы - без защиты
            location /cdn/static/ {
                limit_req zone=cdn_public burst=300 nodelay;
                
                proxy_pass http://minio_backend/requify-static/;
                proxy_cache static_cache;
                proxy_cache_valid 200 304 1d;
                proxy_cache_valid 404 1h;
                proxy_cache_key "$scheme$request_method$host$request_uri";
                
                # Заголовки
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                
                # Заголовки ответа
                add_header X-Cache-Status $upstream_cache_status;
                add_header Cache-Control "public, max-age=86400, immutable";
                add_header X-CDN-Provider "requify-cdn";
                
                # Специфичная обработка для разных типов файлов
                location ~* \.(css|js)$ {
                    expires 30d;
                    add_header Cache-Control "public, max-age=2592000, immutable";
                }
                
                location ~* \.(woff|woff2|ttf|eot)$ {
                    expires 90d;
                    add_header Cache-Control "public, max-age=7776000, immutable";
                }
                
                location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
                    expires 30d;
                    add_header Cache-Control "public, max-age=2592000, immutable";
                }
            }

            # Публичный контент - без защиты
            location /cdn/public/ {
                limit_req zone=cdn_public burst=100 nodelay;
                
                proxy_pass http://minio_backend/requify-public/;
                proxy_cache cdn_cache;
                proxy_cache_valid 200 304 1h;
                proxy_cache_valid 404 10m;
                proxy_cache_key "$scheme$request_method$host$request_uri";
                
                # Заголовки
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                
                # Заголовки ответа
                add_header X-Cache-Status $upstream_cache_status;
                add_header Cache-Control "public, max-age=3600";
                add_header X-CDN-Provider "requify-cdn";
            }
        }

        # === Служебные эндпоинты ===
        
        # Проверка здоровья
        location /health {
            proxy_pass http://requify_backend/health;
            proxy_set_header Host $host;
            access_log off;
            add_header 'Access-Control-Allow-Origin' '*' always;
        }

        # Статус кэша CDN
        location /cdn-status {
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            
            add_header Content-Type application/json;
            return 200 '{"cdn_cache":"/var/cache/nginx/cdn","static_cache":"/var/cache/nginx/static","status":"active"}';
        }

        # Документация API (только для разработки)
        location /docs {
            proxy_pass http://requify_backend/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            add_header 'Access-Control-Allow-Origin' '*' always;
        }

        # OpenAPI схема
        location /openapi.json {
            proxy_pass http://requify_backend/openapi.json;
            proxy_set_header Host $host;
            
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Content-Type' 'application/json';
            
            expires 1h;
            add_header Cache-Control "public";
        }

        # === Фронтенд (по умолчанию) ===
        location / {
            limit_req zone=frontend burst=100 nodelay;
            
            # CORS обработка
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, X-Requested-With, X-Forwarded-For, X-Forwarded-Proto' always;
                add_header 'Access-Control-Max-Age' 86400;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            proxy_pass http://requify_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # CORS заголовки
            add_header 'Access-Control-Allow-Origin' '*' always;
            
            # Таймауты
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Поддержка SPA роутинга
            try_files $uri $uri/ @fallback;
        }

        # Обработка ошибок SPA
        location @fallback {
            proxy_pass http://requify_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Блокировка доступа к служебным файлам
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ \.(ini|log|conf)$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Обработка ошибок
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;

        location = /404.html {
            proxy_pass http://requify_frontend/404;
            internal;
        }

        location = /50x.html {
            proxy_pass http://requify_frontend/500;
            internal;
        }
    }
} 