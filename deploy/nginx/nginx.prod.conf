user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Оптимизация для продакшн
worker_rlimit_nofile 16384;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Формат логирования
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    # Логирование CDN запросов
    log_format cdn_format '$remote_addr - $remote_user [$time_local] "$request" '
                         '$status $body_bytes_sent "$http_referer" '
                         '"$http_user_agent" "cdn_key=$arg_key" '
                         'cache_status=$upstream_cache_status ssl_protocol=$ssl_protocol';

    access_log /var/log/nginx/access.log main;

    # Основные настройки
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 200;
    types_hash_max_size 4096;
    server_tokens off;

    # Лимиты загрузки файлов для продакшн
    client_max_body_size 500M;
    client_body_buffer_size 2M;
    client_header_buffer_size 16k;
    large_client_header_buffers 8 16k;

    # Продвинутое gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 9;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        application/x-font-ttf
        application/vnd.ms-fontobject
        font/opentype
        application/wasm
        application/octet-stream;

    # Brotli сжатие (если доступно)
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Настройки кэша для CDN (увеличены для продакшн)
    proxy_cache_path /var/cache/nginx/cdn 
                     levels=1:2 
                     keys_zone=cdn_cache:500m 
                     max_size=10g 
                     inactive=240m 
                     use_temp_path=off;

    # Кэш для статических файлов
    proxy_cache_path /var/cache/nginx/static 
                     levels=1:2 
                     keys_zone=static_cache:200m 
                     max_size=5g 
                     inactive=120m 
                     use_temp_path=off;

    # Строгие ограничения скорости для продакшн
    limit_req_zone $binary_remote_addr zone=api:20m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=cdn_protected:20m rate=3r/s;
    limit_req_zone $binary_remote_addr zone=cdn_public:20m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=frontend:20m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=2r/m;

    # Ограничения соединений
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_conn_zone $server_name zone=perserver:10m;

    # Проверка валидности CDN ключа для продакшн
    map $arg_key $valid_cdn_key {
        default 0;
        # Продакшн ключи (должны быть сложными)
        "prod_cdn_2024_secure_key_a1b2c3d4" 1;
        "requify_prod_access_2024_x9y8z7" 1;
        # Временные ключи для разработки (убрать в продакшне)
        # "dev_temp_key_remove_in_prod" 1;
    }

    # Geo-блокировка (при необходимости)
    # geo $blocked_country {
    #     default 0;
    #     include /etc/nginx/conf.d/blocked_countries.conf;
    # }

    # Upstream серверы с расширенными настройками
    upstream requify_backend {
        least_conn;
        server backend:8000 max_fails=3 fail_timeout=30s weight=1;
        # server backend2:8000 max_fails=3 fail_timeout=30s weight=1;  # Для масштабирования
        keepalive 64;
        keepalive_requests 100;
        keepalive_timeout 60s;
    }

    upstream requify_frontend {
        server frontend:80 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # MinIO object storage upstream
    upstream minio_backend {
        least_conn;
        server minio:9000 max_fails=3 fail_timeout=30s;
        keepalive 64;
    }

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name _;
        
        # Разрешить Let's Encrypt проверки
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Основной HTTPS сервер
    server {
        listen 443 ssl http2;
        server_name _;

        # SSL конфигурация
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        
        # Современные SSL настройки
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:50m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        
        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        
        # HSTS
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Логи
        access_log /var/log/nginx/requify_https_access.log main;
        error_log /var/log/nginx/requify_https_error.log;

        # Ограничения соединений
        limit_conn perip 50;
        limit_conn perserver 2000;

        # Усиленные заголовки безопасности для продакшн
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' wss: ws:; object-src 'none'; base-uri 'self';" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # Real IP для CloudFlare/CDN
        # set_real_ip_from 103.21.244.0/22;
        # set_real_ip_from 103.22.200.0/22;
        # real_ip_header CF-Connecting-IP;

        # === API маршруты с аутентификацией ===
        location /api/v1/auth/ {
            limit_req zone=login burst=5 nodelay;
            
            # Geo-блокировка для auth endpoints
            # if ($blocked_country) {
            #     return 444;
            # }
            
            proxy_pass http://requify_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Дополнительные заголовки безопасности для auth
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
        }

        # Остальные API маршруты
        location /api/ {
            limit_req zone=api burst=100 nodelay;
            
            proxy_pass http://requify_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Таймауты
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Буферизация
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 32 16k;
        }

        # === CDN маршруты с усиленной защитой ===
        location /cdn/ {
            access_log /var/log/nginx/cdn_access.log cdn_format;
            
            # Защищенный контент с ключевым доступом
            location ~ ^/cdn/(?!public/|avatars/|static/).*$ {
                # Строгая проверка ключа
                if ($valid_cdn_key = 0) {
                    return 403 '{"error":"Access Denied","message":"Valid CDN key required","code":4031}';
                }
                
                limit_req zone=cdn_protected burst=5 nodelay;
                
                # Проксирование к MinIO
                rewrite ^/cdn/(.*)$ /$1 break;
                proxy_pass http://minio_backend/requify-protected/;
                
                # Агрессивное кэширование защищенного контента
                proxy_cache cdn_cache;
                proxy_cache_valid 200 304 1h;
                proxy_cache_valid 404 2m;
                proxy_cache_key "$scheme$request_method$host$request_uri$arg_key";
                proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
                proxy_cache_revalidate on;
                proxy_cache_lock on;
                
                # Заголовки
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                
                # Заголовки ответа
                add_header X-Cache-Status $upstream_cache_status;
                add_header Cache-Control "private, max-age=3600";
                add_header X-CDN-Provider "requify-cdn-secure";
                add_header X-Content-Type-Options "nosniff";
                add_header X-Frame-Options "DENY";
            }

            # Публичные аватары
            location /cdn/avatars/ {
                limit_req zone=cdn_public burst=500 nodelay;
                
                proxy_pass http://minio_backend/requify-avatars/;
                proxy_cache cdn_cache;
                proxy_cache_valid 200 304 4h;
                proxy_cache_valid 404 15m;
                proxy_cache_key "$scheme$request_method$host$request_uri";
                proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
                
                # Заголовки
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                
                # Заголовки ответа
                add_header X-Cache-Status $upstream_cache_status;
                add_header Cache-Control "public, max-age=14400";
                add_header X-CDN-Provider "requify-cdn";
                
                # WebP оптимизация
                location ~* \.(jpg|jpeg|png)$ {
                    expires 30d;
                    add_header Cache-Control "public, immutable";
                    add_header Vary "Accept, Accept-Encoding";
                }
            }

            # Статические файлы с максимальным кэшированием
            location /cdn/static/ {
                limit_req zone=cdn_public burst=1000 nodelay;
                
                proxy_pass http://minio_backend/requify-static/;
                proxy_cache static_cache;
                proxy_cache_valid 200 304 7d;
                proxy_cache_valid 404 1h;
                proxy_cache_key "$scheme$request_method$host$request_uri";
                proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
                
                # Заголовки
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                
                # Заголовки ответа
                add_header X-Cache-Status $upstream_cache_status;
                add_header Cache-Control "public, max-age=604800, immutable";
                add_header X-CDN-Provider "requify-cdn";
                
                # Специфичная обработка типов файлов
                location ~* \.(css|js)$ {
                    expires 90d;
                    add_header Cache-Control "public, max-age=7776000, immutable";
                    add_header Vary "Accept-Encoding";
                }
                
                location ~* \.(woff|woff2|ttf|eot)$ {
                    expires 1y;
                    add_header Cache-Control "public, max-age=31536000, immutable";
                }
            }

            # Публичный контент
            location /cdn/public/ {
                limit_req zone=cdn_public burst=200 nodelay;
                
                proxy_pass http://minio_backend/requify-public/;
                proxy_cache cdn_cache;
                proxy_cache_valid 200 304 2h;
                proxy_cache_valid 404 15m;
                proxy_cache_key "$scheme$request_method$host$request_uri";
                
                # Заголовки
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                
                # Заголовки ответа
                add_header X-Cache-Status $upstream_cache_status;
                add_header Cache-Control "public, max-age=7200";
                add_header X-CDN-Provider "requify-cdn";
            }
        }

        # === Служебные эндпоинты ===
        
        # Проверка здоровья
        location /health {
            proxy_pass http://requify_backend/health;
            proxy_set_header Host $host;
            access_log off;
        }

        # Статус кэша CDN (только для админов)
        location /cdn-status {
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            
            add_header Content-Type application/json;
            return 200 '{"cdn_cache":"/var/cache/nginx/cdn","static_cache":"/var/cache/nginx/static","status":"production","ssl":"enabled"}';
        }

        # API документация (отключена в продакшне)
        location /docs {
            deny all;
            return 404;
        }

        location /openapi.json {
            deny all;
            return 404;
        }

        # Security.txt
        location /.well-known/security.txt {
            return 200 "Contact: security@requify.com\nExpires: 2025-12-31T23:59:59.000Z\nCanonical: https://requify.com/.well-known/security.txt\n";
            add_header Content-Type text/plain;
        }

        # === Фронтенд (по умолчанию) ===
        location / {
            limit_req zone=frontend burst=200 nodelay;
            
            proxy_pass http://requify_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Таймауты
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Кэширование SPA
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
            
            # Поддержка SPA роутинга
            try_files $uri $uri/ @fallback;
        }

        # Обработка ошибок SPA
        location @fallback {
            proxy_pass http://requify_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Блокировка доступа к служебным файлам
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ \.(ini|log|conf|sql|bak)$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Обработка ошибок
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;

        location = /404.html {
            proxy_pass http://requify_frontend/404;
            internal;
        }

        location = /50x.html {
            proxy_pass http://requify_frontend/500;
            internal;
        }
    }
}