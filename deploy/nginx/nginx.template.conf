user nginx;
worker_processes ${NGINX_WORKER_PROCESSES:-auto};
error_log /var/log/nginx/error.log ${NGINX_LOG_LEVEL:-warn};
pid /var/run/nginx.pid;

# Оптимизация
worker_rlimit_nofile ${NGINX_WORKER_RLIMIT_NOFILE:-8192};

events {
    worker_connections ${NGINX_WORKER_CONNECTIONS:-2048};
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Формат логирования
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    # Логирование CDN запросов
    log_format cdn_format '$remote_addr - $remote_user [$time_local] "$request" '
                         '$status $body_bytes_sent "$http_referer" '
                         '"$http_user_agent" "cdn_key=$arg_key" '
                         'cache_status=$upstream_cache_status';

    access_log /var/log/nginx/access.log main;

    # Основные настройки
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout ${NGINX_KEEPALIVE_TIMEOUT:-65};
    keepalive_requests ${NGINX_KEEPALIVE_REQUESTS:-100};
    types_hash_max_size ${NGINX_TYPES_HASH_MAX_SIZE:-2048};
    server_tokens off;

    # Лимиты загрузки файлов
    client_max_body_size ${NGINX_CLIENT_MAX_BODY_SIZE:-100M};
    client_body_buffer_size ${NGINX_CLIENT_BODY_BUFFER_SIZE:-1M};
    client_header_buffer_size 8k;
    large_client_header_buffers 4 8k;

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level ${NGINX_GZIP_COMP_LEVEL:-6};
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        application/x-font-ttf
        application/vnd.ms-fontobject
        font/opentype;

    # Настройки кэша для CDN
    proxy_cache_path /var/cache/nginx/cdn 
                     levels=1:2 
                     keys_zone=cdn_cache:${NGINX_CDN_CACHE_SIZE:-200m}
                     max_size=${NGINX_CDN_CACHE_MAX_SIZE:-2g}
                     inactive=${NGINX_CDN_CACHE_INACTIVE:-120m}
                     use_temp_path=off;

    # Кэш для статических файлов
    proxy_cache_path /var/cache/nginx/static 
                     levels=1:2 
                     keys_zone=static_cache:${NGINX_STATIC_CACHE_SIZE:-100m}
                     max_size=${NGINX_STATIC_CACHE_MAX_SIZE:-1g}
                     inactive=${NGINX_STATIC_CACHE_INACTIVE:-60m}
                     use_temp_path=off;

    # Ограничения скорости
    limit_req_zone $binary_remote_addr zone=api:10m rate=${NGINX_API_RATE_LIMIT:-30r/s};
    limit_req_zone $binary_remote_addr zone=cdn_protected:10m rate=${NGINX_CDN_PROTECTED_RATE_LIMIT:-5r/s};
    limit_req_zone $binary_remote_addr zone=cdn_public:10m rate=${NGINX_CDN_PUBLIC_RATE_LIMIT:-100r/s};
    limit_req_zone $binary_remote_addr zone=frontend:10m rate=${NGINX_FRONTEND_RATE_LIMIT:-50r/s};

    # Ограничения соединений
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    # Проверка валидности CDN ключа
    map $arg_key $valid_cdn_key {
        default 0;
        "${CDN_KEY_1}" 1;
        "${CDN_KEY_2}" 1;
        "${CDN_KEY_3}" 1;
    }

    # Upstream серверы
    upstream requify_backend {
        least_conn;
        server ${BACKEND_HOST:-backend}:${BACKEND_PORT:-8000} max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream requify_frontend {
        server ${FRONTEND_HOST:-frontend}:${FRONTEND_PORT:-3000} max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # MinIO object storage upstream
    upstream minio_backend {
        least_conn;
        server ${MINIO_HOST:-minio}:${MINIO_PORT:-9000} max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # SSL/HTTP server configuration
    server {
        listen 80;
        server_name _;

        # SSL редирект для продакшн
        ${SSL_REDIRECT_CONFIG}

        # Логи
        access_log /var/log/nginx/requify_access.log main;
        error_log /var/log/nginx/requify_error.log;

        # Ограничения соединений
        limit_conn perip ${NGINX_MAX_CONNECTIONS_PER_IP:-20};

        # Заголовки безопасности
        add_header X-Frame-Options "${NGINX_X_FRAME_OPTIONS:-DENY}" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        
        # CSP для разных сред
        ${CSP_HEADER_CONFIG}

        # === API маршруты ===
        location /api/ {
            limit_req zone=api burst=${NGINX_API_BURST:-50} nodelay;
            
            # CORS обработка для разработки
            ${CORS_CONFIG}

            proxy_pass http://requify_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Таймауты
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Буферизация
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 16 8k;
        }

        # === CDN маршруты с защитой ===
        location /cdn/ {
            access_log /var/log/nginx/cdn_access.log cdn_format;
            
            # Защищенный контент с ключевым доступом
            location ~ ^/cdn/(?!public/|avatars/|static/).*$ {
                # Проверка наличия ключа
                if ($valid_cdn_key = 0) {
                    return 403 '{"error":"Access Denied","message":"Valid CDN key required"}';
                }
                
                limit_req zone=cdn_protected burst=${NGINX_CDN_PROTECTED_BURST:-10} nodelay;
                
                # Проксирование к MinIO
                rewrite ^/cdn/(.*)$ /$1 break;
                proxy_pass http://minio_backend/requify-protected/;
                
                # Кэширование защищенного контента
                proxy_cache cdn_cache;
                proxy_cache_valid 200 304 ${NGINX_CDN_PROTECTED_CACHE_VALID:-30m};
                proxy_cache_valid 404 5m;
                proxy_cache_key "$scheme$request_method$host$request_uri$arg_key";
                
                # Заголовки
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                
                # Заголовки ответа
                add_header X-Cache-Status $upstream_cache_status;
                add_header Cache-Control "private, max-age=${NGINX_CDN_PROTECTED_MAX_AGE:-1800}";
                add_header X-CDN-Provider "requify-cdn";
                add_header X-Content-Type-Options "nosniff";
                add_header X-Frame-Options "DENY";
            }

            # Публичные аватары
            location /cdn/avatars/ {
                limit_req zone=cdn_public burst=${NGINX_CDN_PUBLIC_BURST:-200} nodelay;
                
                proxy_pass http://minio_backend/requify-avatars/;
                proxy_cache cdn_cache;
                proxy_cache_valid 200 304 ${NGINX_CDN_AVATARS_CACHE_VALID:-2h};
                proxy_cache_valid 404 10m;
                proxy_cache_key "$scheme$request_method$host$request_uri";
                
                # Заголовки
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                
                # Заголовки ответа
                add_header X-Cache-Status $upstream_cache_status;
                add_header Cache-Control "public, max-age=${NGINX_CDN_AVATARS_MAX_AGE:-7200}";
                add_header X-CDN-Provider "requify-cdn";
                
                # Оптимизация изображений
                location ~* \.(jpg|jpeg|png|webp|gif)$ {
                    expires ${NGINX_CDN_IMAGES_EXPIRES:-7d};
                    add_header Cache-Control "public, immutable";
                    add_header Vary "Accept-Encoding";
                }
            }

            # Статические файлы
            location /cdn/static/ {
                limit_req zone=cdn_public burst=${NGINX_CDN_STATIC_BURST:-300} nodelay;
                
                proxy_pass http://minio_backend/requify-static/;
                proxy_cache static_cache;
                proxy_cache_valid 200 304 ${NGINX_CDN_STATIC_CACHE_VALID:-1d};
                proxy_cache_valid 404 1h;
                proxy_cache_key "$scheme$request_method$host$request_uri";
                
                # Заголовки
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                
                # Заголовки ответа
                add_header X-Cache-Status $upstream_cache_status;
                add_header Cache-Control "public, max-age=${NGINX_CDN_STATIC_MAX_AGE:-86400}, immutable";
                add_header X-CDN-Provider "requify-cdn";
                
                # Специфичная обработка для разных типов файлов
                location ~* \.(css|js)$ {
                    expires ${NGINX_CDN_CSS_JS_EXPIRES:-30d};
                    add_header Cache-Control "public, max-age=2592000, immutable";
                }
                
                location ~* \.(woff|woff2|ttf|eot)$ {
                    expires ${NGINX_CDN_FONTS_EXPIRES:-90d};
                    add_header Cache-Control "public, max-age=7776000, immutable";
                }
            }

            # Публичный контент
            location /cdn/public/ {
                limit_req zone=cdn_public burst=${NGINX_CDN_PUBLIC_CONTENT_BURST:-100} nodelay;
                
                proxy_pass http://minio_backend/requify-public/;
                proxy_cache cdn_cache;
                proxy_cache_valid 200 304 ${NGINX_CDN_PUBLIC_CACHE_VALID:-1h};
                proxy_cache_valid 404 10m;
                proxy_cache_key "$scheme$request_method$host$request_uri";
                
                # Заголовки
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_Set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                
                # Заголовки ответа
                add_header X-Cache-Status $upstream_cache_status;
                add_header Cache-Control "public, max-age=${NGINX_CDN_PUBLIC_MAX_AGE:-3600}";
                add_header X-CDN-Provider "requify-cdn";
            }
        }

        # === Служебные эндпоинты ===
        
        # Проверка здоровья
        location /health {
            proxy_pass http://requify_backend/health;
            proxy_set_header Host $host;
            access_log off;
        }

        # Статус кэша CDN (только для админов)
        location /cdn-status {
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            
            add_header Content-Type application/json;
            return 200 '{"cdn_cache":"/var/cache/nginx/cdn","static_cache":"/var/cache/nginx/static","status":"${ENVIRONMENT:-development}"}';
        }

        # API документация
        ${API_DOCS_CONFIG}

        # === Фронтенд (по умолчанию) ===
        location / {
            limit_req zone=frontend burst=${NGINX_FRONTEND_BURST:-100} nodelay;
            
            # CORS обработка для разработки
            ${CORS_CONFIG}

            proxy_pass http://requify_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Таймауты
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Поддержка SPA роутинга
            try_files $uri $uri/ @fallback;
        }

        # Обработка ошибок SPA
        location @fallback {
            proxy_pass http://requify_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Блокировка доступа к служебным файлам
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ \.(ini|log|conf|sql|bak)$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Обработка ошибок
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;

        location = /404.html {
            proxy_pass http://requify_frontend/404;
            internal;
        }

        location = /50x.html {
            proxy_pass http://requify_frontend/500;
            internal;
        }
    }

    # HTTPS server (если SSL включен)
    ${HTTPS_SERVER_CONFIG}
}