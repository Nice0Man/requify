worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Логирование
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Основные настройки
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # CORS configuration for development
    map $http_origin $cors_origin {
        ~^https?://localhost(:[0-9]+)?$ $http_origin;
        ~^https?://127\.0\.0\.1(:[0-9]+)?$ $http_origin;
        ~^https?://0\.0\.0\.0(:[0-9]+)?$ $http_origin;
        default "*";
    }

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Лимиты загрузки файлов для разработки
    client_max_body_size 100M;
    client_body_buffer_size 1M;
    client_header_buffer_size 8k;
    large_client_header_buffers 4 8k;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # Cache settings for CDN (dev)
    proxy_cache_path /tmp/nginx_cache 
                     levels=1:2 
                     keys_zone=dev_cache:10m 
                     max_size=100m 
                     inactive=10m 
                     use_temp_path=off;

    # Upstream для backend
    upstream requify_backend {
        server backend:8000;
        keepalive 32;
    }

    # Upstream для frontend
    upstream requify_frontend {
        server frontend:3000;
        keepalive 32;
    }

    # MinIO object storage upstream
    upstream minio_backend {
        server minio:9000 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # Основной сервер для разработки - API Gateway
    server {
        listen 80;
        server_name localhost 127.0.0.1;

        # Логи
        access_log /var/log/nginx/requify_dev_access.log main;
        error_log /var/log/nginx/requify_dev_error.log;

        # Общие заголовки безопасности для разработки
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Глобальная обработка CORS preflight запросов
        location ~* "^/api/.*" {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, X-Requested-With, X-Forwarded-For, X-Forwarded-Proto, Cache-Control, Pragma' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            # Скрыть CORS заголовки от backend чтобы избежать дублирования
            proxy_hide_header 'Access-Control-Allow-Origin';
            proxy_hide_header 'Access-Control-Allow-Credentials';
            proxy_hide_header 'Access-Control-Allow-Methods';
            proxy_hide_header 'Access-Control-Allow-Headers';
            proxy_hide_header 'Access-Control-Expose-Headers';

            # API маршруты к backend
            proxy_pass http://requify_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            # CORS заголовки для API (добавляем только здесь)
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range, Content-Disposition' always;
            
            # Таймауты для API
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Буферизация
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # === CDN Routes for MinIO Object Storage (Development) ===
        
        # Avatar images - short cache for dev
        location /avatars/ {
            proxy_pass http://minio_backend/requify-avatars/;
            proxy_cache dev_cache;
            proxy_cache_valid 200 304 5m;
            proxy_cache_valid 404 1m;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            
            # Headers
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Response headers
            add_header X-Cache-Status $upstream_cache_status;
            add_header Cache-Control "public, max-age=300";
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
        }

        # General uploads - short cache for dev
        location /cdn/uploads/ {
            proxy_pass http://minio_backend/requify-uploads/;
            proxy_cache dev_cache;
            proxy_cache_valid 200 304 3m;
            proxy_cache_valid 404 1m;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            
            # Headers
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Response headers
            add_header X-Cache-Status $upstream_cache_status;
            add_header Cache-Control "public, max-age=180";
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
        }

        # Documents - no cache for dev (security)
        location /cdn/documents/ {
            proxy_pass http://minio_backend/requify-documents/;
            
            # Headers
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Response headers
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
        }

        # Direct MinIO API access (for development debugging)
        location /minio-api/ {
            proxy_pass http://minio_backend/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # No caching for API calls
            proxy_cache off;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
        }

        # Cache status endpoint for debugging
        location /cache-status {
            access_log off;
            add_header Content-Type application/json;
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            return 200 '{"cache_path":"/tmp/nginx_cache","cache_zone":"dev_cache","env":"development"}';
        }

        # WebSocket поддержка для HMR
        location /ws {
            proxy_pass http://requify_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # Документация API (лучшая практика)
        location /docs {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, X-Requested-With' always;
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            proxy_pass http://requify_backend/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # CORS заголовки
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
        }

        # ReDoc документация
        location /redoc {
            proxy_pass http://requify_backend/redoc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
        }

        # OpenAPI схема
        location /openapi.json {
            proxy_pass http://requify_backend/openapi.json;
            proxy_set_header Host $host;
            
            # CORS заголовки
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Content-Type' 'application/json';
            
            # Кэширование схемы в разработке (короткое время)
            expires 5m;
            add_header Cache-Control "public, must-revalidate";
        }

        # Проверка здоровья backend
        location /health {
            proxy_pass http://requify_backend/health;
            proxy_set_header Host $host;
            access_log off;
            
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
        }

        # Статические файлы backend
        location /static/ {
            proxy_pass http://requify_backend/static/;
            expires 1h;
            add_header Cache-Control "public";
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
        }

        # Загруженные файлы
        location /uploads/ {
            proxy_pass http://requify_backend/uploads/;
            expires 1h;
            add_header Cache-Control "public";
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
        }

        # Медиа файлы
        location /media/ {
            proxy_pass http://requify_backend/media/;
            expires 1h;
            add_header Cache-Control "public";
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
        }

        # Frontend статические ресурсы
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://requify_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            expires 1h;
            add_header Cache-Control "public";
        }

        # Frontend SPA - все остальные запросы
        location / {
            # Обработка CORS для frontend
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, X-Requested-With' always;
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            proxy_pass http://requify_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            # CORS заголовки для frontend
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            
            # Поддержка HMR
            proxy_read_timeout 86400;
        }

        # Обработка ошибок
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;

        location = /404.html {
            proxy_pass http://requify_frontend;
        }

        location = /50x.html {
            proxy_pass http://requify_frontend;
        }
    }

    # Upgrade connection map для WebSockets
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
} 