worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Логирование
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Основные настройки
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # CORS для разработки
    map $http_origin $cors_origin {
        ~^http://localhost:3000$ $http_origin;
        ~^http://localhost:8080$ $http_origin;
        ~^http://127.0.0.1:3000$ $http_origin;
        default "";
    }

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Лимиты загрузки файлов для разработки
    client_max_body_size 50M;

    # Upstream для backend
    upstream requify_backend {
        server backend:8000;
    }

    # Upstream для frontend
    upstream requify_frontend {
        server frontend:3000;
    }

    # Основной сервер для разработки
    server {
        listen 80;
        server_name localhost;

        # Логи
        access_log /var/log/nginx/requify_dev_access.log main;
        error_log /var/log/nginx/requify_dev_error.log;

        # Поддержка WebSockets для HMR
        location /ws {
            proxy_pass http://requify_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API маршруты к backend
        location /api/ {
            proxy_pass http://requify_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # CORS для разработки
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
            add_header Access-Control-Allow-Credentials true always;
            
            # Preflight requests
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $cors_origin;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept";
                add_header Access-Control-Allow-Credentials true;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
            
            # Таймауты для API
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Проверка здоровья backend
        location /health {
            proxy_pass http://requify_backend/health;
            proxy_set_header Host $host;
            access_log off;
        }

        # Документация API (Swagger)
        location /docs {
            proxy_pass http://requify_backend/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # OpenAPI схема
        location /openapi.json {
            proxy_pass http://requify_backend/openapi.json;
            proxy_set_header Host $host;
            expires 1h;
        }

        # Статические файлы (если есть)
        location /static/ {
            alias /var/www/static/;
            expires 1d;
            add_header Cache-Control "public";
        }

        # Загруженные файлы
        location /uploads/ {
            alias /var/www/uploads/;
            expires 1d;
            add_header Cache-Control "public";
        }

        # Все остальное направляем на frontend для SPA
        location / {
            proxy_pass http://requify_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Поддержка HMR
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # CORS для разработки
            add_header Access-Control-Allow-Origin $cors_origin always;
        }

        # Обработка ошибок
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;

        location = /404.html {
            root /var/www/html;
        }

        location = /50x.html {
            root /var/www/html;
        }
    }
} 