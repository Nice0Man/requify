[tool:pytest]
minversion = 6.0
addopts = 
    -ra
    -q
    --strict-markers
    --strict-config
    --tb=short
    --maxfail=5
    --disable-warnings
    --color=yes
    --durations=10
    --show-capture=no
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, requires external services)
    performance: Performance tests (slow, measures response times)
    security: Security tests (checks for vulnerabilities)
    auth: Authentication related tests
    api: API endpoint tests
    smoke: Smoke tests (basic functionality)
    regression: Regression tests
    slow: Slow running tests
    domain: Domain-specific tests for API endpoints
    ci: Tests that should run in CI environment
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::pytest.PytestDeprecationWarning
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
asyncio_mode = auto
junit_family = xunit2
cache_dir = .pytest_cache