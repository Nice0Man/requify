<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Requify - Modern Requirements Management System for teams and organizations" />
    <meta name="theme-color" content="#1976d2" />
    <meta name="robots" content="noindex, nofollow" />
    
    <!-- Content Security Policy for development -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self' 'unsafe-inline';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: blob: http://cdn.requify.local;
      connect-src 'self' ws: wss: http://localhost:* http://backend:* http://*.requify.local;
      worker-src 'self' blob:;
    ">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- Preconnect to Google Fonts for better performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Title -->
    <title>Requify - Requirements Management System</title>
    
    <!-- Clean base styles -->
    <style>
      /* Minimal base styles - Let CSS handle the rest */
      html {
        height: 100%;
        font-family: system-ui, -apple-system, sans-serif;
      }
      
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #ffffff;
      }
      
      #root {
        min-height: 100vh;
      }
      
      /* Loading indicator */
      .initial-loading {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 9999;
        display: flex;
        align-items: center;
        gap: 12px;
        color: #666;
        font-size: 1.1rem;
      }
      
      .loading-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #f3f3f3;
        border-top: 3px solid #1976d2;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Fallback loading indicator -->
      <div class="initial-loading">
        <div class="loading-spinner"></div>
        <span>Loading Requify...</span>
      </div>
    </div>
    
    <!-- Main application entry point -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
