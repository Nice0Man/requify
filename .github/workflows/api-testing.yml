name: API Testing CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/api-testing.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/api-testing.yml'
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_level:
        description: 'Test level to run'
        required: true
        default: 'comprehensive'
        type: choice
        options:
        - unit
        - integration
        - comprehensive
        - performance
        - security

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'
  POETRY_VERSION: '1.7.1'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      python-version: ${{ steps.setup-python.outputs.python-version }}
      poetry-cache-hit: ${{ steps.poetry-cache.outputs.cache-hit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache Poetry installation
        uses: actions/cache@v3
        id: poetry-cache
        with:
          path: ~/.local/share/pypoetry
          key: poetry-${{ runner.os }}-${{ env.POETRY_VERSION }}

      - name: Install Poetry
        if: steps.poetry-cache.outputs.cache-hit != 'true'
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

  lint-and-format:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ needs.setup.outputs.python-version }}

      - name: Restore Poetry cache
        uses: actions/cache@v3
        with:
          path: ~/.local/share/pypoetry
          key: poetry-${{ runner.os }}-${{ env.POETRY_VERSION }}

      - name: Get pip cache dir
        id: pip-cache
        shell: bash
        run: |
          echo "dir=$(pip cache dir)" >> $GITHUB_OUTPUT

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.pip-cache.outputs.dir }}
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/pyproject.toml', 'backend/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Poetry virtual environment
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: ${{ runner.os }}-venv-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('backend/pyproject.toml', 'backend/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-venv-${{ steps.setup-python.outputs.python-version }}-

      - name: Install dependencies
        working-directory: backend
        run: |
          poetry install --with dev,test

      - name: Run linting (ruff)
        working-directory: backend
        run: |
          poetry run ruff check . --output-format=github

      - name: Run formatting check (black)
        working-directory: backend
        run: |
          poetry run black --check --diff .

      - name: Run type checking (mypy)
        working-directory: backend
        run: |
          poetry run mypy . --ignore-missing-imports || true

  unit-tests:
    needs: [setup, lint-and-format]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: requify_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ needs.setup.outputs.python-version }}

      - name: Restore Poetry cache
        uses: actions/cache@v3
        with:
          path: ~/.local/share/pypoetry
          key: poetry-${{ runner.os }}-${{ env.POETRY_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: backend/.venv
          key: venv-${{ runner.os }}-${{ hashFiles('backend/pyproject.toml') }}

      - name: Install dependencies
        working-directory: backend
        run: |
          poetry install --with dev,test

      - name: Create test environment file
        working-directory: backend
        run: |
          cat > .env.test << EOF
          # Test Environment Configuration
          RUN__ENV=testing
          RUN__DEBUG=false
          RUN__LOG_LEVEL=INFO
          
          # Database
          DATABASE__HOST=localhost
          DATABASE__PORT=5432
          DATABASE__USERNAME=postgres
          DATABASE__PASSWORD=postgres
          DATABASE__DATABASE=requify_test
          DATABASE__ECHO=false
          
          # Redis
          REDIS__HOST=localhost
          REDIS__PORT=6379
          REDIS__DATABASE=1
          
          # Security
          SECURITY__SECRET_KEY=test-secret-key-change-in-production-very-long-and-secure
          SECURITY__ACCESS_TOKEN_EXPIRE_MINUTES=30
          SECURITY__REFRESH_TOKEN_EXPIRE_DAYS=7
          
          # Admin
          ADMIN__EMAIL=admin@example.com
          ADMIN__PASSWORD=SecurePass123!
          ADMIN__NAME=Test Admin
          
          # Email (disabled for testing)
          EMAIL__ENABLED=false
          
          # File Storage (local for testing)
          STORAGE__TYPE=local
          STORAGE__LOCAL_PATH=./test_uploads
          EOF

      - name: Run database migrations
        working-directory: backend
        env:
          ENV_FILE: .env.test
        run: |
          poetry run alembic upgrade head

      - name: Run unit tests
        working-directory: backend
        env:
          ENV_FILE: .env.test
        run: |
          poetry run pytest tests/ \
            -v \
            --tb=short \
            --cov=app \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            --junit-xml=test-results.xml \
            -m "not integration and not performance"

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: unit-test-results
          path: |
            backend/test-results.xml
            backend/htmlcov/
            backend/coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        if: always()
        with:
          file: backend/coverage.xml
          flags: unittests
          name: codecov-umbrella

  integration-tests:
    needs: [setup, unit-tests]
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' || github.event.inputs.test_level == 'comprehensive' || github.event.inputs.test_level == 'integration'
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: requify_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ needs.setup.outputs.python-version }}

      - name: Restore Poetry cache
        uses: actions/cache@v3
        with:
          path: ~/.local/share/pypoetry
          key: poetry-${{ runner.os }}-${{ env.POETRY_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: backend/.venv
          key: venv-${{ runner.os }}-${{ hashFiles('backend/pyproject.toml') }}

      - name: Install dependencies
        working-directory: backend
        run: |
          poetry install --with dev,test

      - name: Create test environment file
        working-directory: backend
        run: |
          cat > .env.test << EOF
          RUN__ENV=testing
          RUN__DEBUG=false
          RUN__LOG_LEVEL=INFO
          DATABASE__HOST=localhost
          DATABASE__PORT=5432
          DATABASE__USERNAME=postgres
          DATABASE__PASSWORD=postgres
          DATABASE__DATABASE=requify_test
          DATABASE__ECHO=false
          REDIS__HOST=localhost
          REDIS__PORT=6379
          REDIS__DATABASE=1
          SECURITY__SECRET_KEY=test-secret-key-change-in-production-very-long-and-secure
          SECURITY__ACCESS_TOKEN_EXPIRE_MINUTES=30
          SECURITY__REFRESH_TOKEN_EXPIRE_DAYS=7
          ADMIN__EMAIL=admin@example.com
          ADMIN__PASSWORD=SecurePass123!
          ADMIN__NAME=Test Admin
          EMAIL__ENABLED=false
          STORAGE__TYPE=local
          STORAGE__LOCAL_PATH=./test_uploads
          EOF

      - name: Setup test database
        working-directory: backend
        env:
          ENV_FILE: .env.test
        run: |
          poetry run alembic upgrade head
          poetry run python scripts/create_admin.py --non-interactive

      - name: Start backend server
        working-directory: backend
        env:
          ENV_FILE: .env.test
        run: |
          poetry run uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 10

      - name: Wait for server to be ready
        run: |
          timeout 30 bash -c 'until curl -f http://localhost:8000/health; do sleep 1; done'

      - name: Run integration tests
        working-directory: backend
        run: |
          poetry run pytest tests/test_all_domains.py \
            -v \
            --tb=short \
            --junit-xml=integration-results.xml

      - name: Run authentication tests
        working-directory: backend
        run: |
          poetry run python tests/manual_auth_test.py --mode comprehensive --url http://localhost:8000

      - name: Upload integration test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: integration-test-results
          path: backend/integration-results.xml

  performance-tests:
    needs: [setup, integration-tests]
    runs-on: ubuntu-latest
    if: github.event.inputs.test_level == 'performance' || github.event.inputs.test_level == 'comprehensive'
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: requify_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ needs.setup.outputs.python-version }}

      - name: Restore Poetry cache
        uses: actions/cache@v3
        with:
          path: ~/.local/share/pypoetry
          key: poetry-${{ runner.os }}-${{ env.POETRY_VERSION }}

      - name: Install dependencies
        working-directory: backend
        run: |
          poetry install --with dev,test

      - name: Create test environment file
        working-directory: backend
        run: |
          cat > .env.test << EOF
          RUN__ENV=testing
          DATABASE__HOST=localhost
          DATABASE__PORT=5432
          DATABASE__USERNAME=postgres
          DATABASE__PASSWORD=postgres
          DATABASE__DATABASE=requify_test
          REDIS__HOST=localhost
          REDIS__PORT=6379
          SECURITY__SECRET_KEY=test-secret-key-change-in-production-very-long-and-secure
          ADMIN__EMAIL=admin@example.com
          ADMIN__PASSWORD=SecurePass123!
          EOF

      - name: Setup test environment
        working-directory: backend
        env:
          ENV_FILE: .env.test
        run: |
          poetry run alembic upgrade head
          poetry run python scripts/create_admin.py --non-interactive

      - name: Start backend server
        working-directory: backend
        env:
          ENV_FILE: .env.test
        run: |
          poetry run uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 10

      - name: Run performance tests
        working-directory: backend
        run: |
          poetry run python scripts/run_auth_tests.py --mode performance --url http://localhost:8000

      - name: Install Apache Bench
        run: sudo apt-get update && sudo apt-get install -y apache2-utils

      - name: Performance load testing
        run: |
          # Test login endpoint
          ab -n 100 -c 10 -p backend/test_data/login.json -T 'application/x-www-form-urlencoded' http://localhost:8000/api/v1/auth/login || true
          
          # Test health endpoint
          ab -n 1000 -c 50 http://localhost:8000/health || true

      - name: Generate performance report
        run: |
          echo "Performance testing completed" > performance_report.txt
          echo "Load testing results saved" >> performance_report.txt

      - name: Upload performance results
        uses: actions/upload-artifact@v3
        with:
          name: performance-test-results
          path: performance_report.txt

  security-tests:
    needs: [setup, integration-tests]
    runs-on: ubuntu-latest
    if: github.event.inputs.test_level == 'security' || github.event.inputs.test_level == 'comprehensive'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ needs.setup.outputs.python-version }}

      - name: Install security tools
        run: |
          pip install bandit safety

      - name: Run Bandit security scan
        working-directory: backend
        run: |
          bandit -r app/ -f json -o bandit-report.json || true
          bandit -r app/ -f txt

      - name: Run Safety check
        working-directory: backend
        run: |
          safety check --json --output safety-report.json || true
          safety check

      - name: Upload security reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-reports
          path: |
            backend/bandit-report.json
            backend/safety-report.json

  deploy-test-reports:
    needs: [unit-tests, integration-tests]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download test artifacts
        uses: actions/download-artifact@v3
        with:
          path: test-artifacts

      - name: Setup Node.js for report generation
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate test report
        run: |
          mkdir -p test-reports
          echo "# API Testing Report" > test-reports/README.md
          echo "" >> test-reports/README.md
          echo "Generated on: $(date)" >> test-reports/README.md
          echo "" >> test-reports/README.md
          
          if [ -d "test-artifacts/unit-test-results" ]; then
            echo "## Unit Tests" >> test-reports/README.md
            echo "✅ Unit test results available" >> test-reports/README.md
            echo "" >> test-reports/README.md
          fi
          
          if [ -d "test-artifacts/integration-test-results" ]; then
            echo "## Integration Tests" >> test-reports/README.md
            echo "✅ Integration test results available" >> test-reports/README.md
            echo "" >> test-reports/README.md
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: test-reports
          destination_dir: test-reports

  notify:
    needs: [unit-tests, integration-tests, performance-tests, security-tests]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Notify on success
        if: needs.unit-tests.result == 'success' && needs.integration-tests.result == 'success'
        run: |
          echo "🎉 All tests passed successfully!"
          echo "✅ Unit tests: PASSED"
          echo "✅ Integration tests: PASSED"

      - name: Notify on failure
        if: needs.unit-tests.result == 'failure' || needs.integration-tests.result == 'failure'
        run: |
          echo "❌ Some tests failed!"
          echo "Unit tests: ${{ needs.unit-tests.result }}"
          echo "Integration tests: ${{ needs.integration-tests.result }}"

      - name: Create issue on test failure
        if: failure() && github.ref == 'refs/heads/main'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'API Tests Failed on Main Branch',
              body: `
              ## Test Failure Alert
              
              The API tests have failed on the main branch.
              
              **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              **Commit:** ${{ github.sha }}
              **Branch:** ${{ github.ref }}
              
              Please investigate and fix the failing tests.
              `,
              labels: ['bug', 'ci-failure', 'priority-high']
            })
