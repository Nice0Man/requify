name: Backend CI/CD Pipeline

on:
  push:
    branches: [ main, dev, dev-backend ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, dev, dev-backend ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Enable debug mode'
        required: false
        default: 'false'
        type: boolean

env:
  PYTHON_VERSION: '3.11'
  POETRY_VERSION: '1.6.1'

jobs:
  code-quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      id: setup-python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Cache Poetry installer
      id: poetry-cache
      uses: actions/cache@v3
      with:
        path: ~/.local/share/pypoetry
        key: poetry-${{ runner.os }}-${{ env.POETRY_VERSION }}
    
    - name: Install Poetry
      if: steps.poetry-cache.outputs.cache-hit != 'true'
      uses: snok/install-poetry@v1
      with:
        version: ${{ env.POETRY_VERSION }}
        virtualenvs-create: true
        virtualenvs-in-project: true
    
    - name: Get pip cache dir
      id: pip-cache
      shell: bash
      run: |
        echo "dir=$(pip cache dir)" >> $GITHUB_OUTPUT
    
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ${{ steps.pip-cache.outputs.dir }}
        key: ${{ runner.os }}-pip-${{ hashFiles('backend/pyproject.toml', 'backend/poetry.lock') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Cache Poetry virtual environment
      uses: actions/cache@v4
      with:
        path: backend/.venv
        key: ${{ runner.os }}-venv-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('backend/pyproject.toml', 'backend/poetry.lock') }}
        restore-keys: |
          ${{ runner.os }}-venv-${{ steps.setup-python.outputs.python-version }}-
    
    - name: Install dependencies
      working-directory: backend
      run: |
        poetry install --with dev,test
    
    - name: Code formatting check (Black)
      working-directory: backend
      run: |
        poetry run black --check --diff .
    
    - name: Import sorting check (isort)
      working-directory: backend
      run: |
        poetry run isort --check-only --diff .
    
    - name: Linting (Flake8)
      working-directory: backend
      run: |
        poetry run flake8 .
    
    - name: Type checking (MyPy)
      working-directory: backend
      run: |
        poetry run mypy .
    
    - name: Security scan (Bandit)
      working-directory: backend
      run: |
        poetry run bandit -r app/ -f json -o bandit-report.json || true
        poetry run bandit -r app/ -f txt
    
    - name: Dependency vulnerability scan (Safety)
      working-directory: backend
      run: |
        poetry run safety check --json --output safety-report.json || true
        poetry run safety check
    
    - name: Upload security reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-reports
        path: |
          backend/bandit-report.json
          backend/safety-report.json

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: code-quality
    
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      id: setup-python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: ${{ env.POETRY_VERSION }}
        virtualenvs-create: true
        virtualenvs-in-project: true
    
    - name: Cache Poetry virtual environment
      uses: actions/cache@v4
      with:
        path: backend/.venv
        key: ${{ runner.os }}-venv-${{ matrix.python-version }}-${{ hashFiles('backend/pyproject.toml', 'backend/poetry.lock') }}
        restore-keys: |
          ${{ runner.os }}-venv-${{ matrix.python-version }}-
    
    - name: Install dependencies
      working-directory: backend
      run: |
        poetry install --with dev,test
    
    - name: Run unit tests
      working-directory: backend
      run: |
        poetry run pytest tests/ -v \
          --cov=app \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term-missing \
          --junit-xml=test-results.xml \
          -m "unit or not integration and not performance and not security"
    
    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results-${{ matrix.python-version }}
        path: |
          backend/test-results.xml
          backend/htmlcov/
          backend/coverage.xml

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_USER: testuser
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      id: setup-python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: ${{ env.POETRY_VERSION }}
        virtualenvs-create: true
        virtualenvs-in-project: true
    
    - name: Install dependencies
      working-directory: backend
      run: |
        poetry install --with dev,test
    
    - name: Wait for services
      run: |
        sleep 10
        docker ps
    
    - name: Run integration tests
      working-directory: backend
      env:
        DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
        REDIS_URL: redis://localhost:6379/0
        TESTING: true
      run: |
        poetry run pytest tests/ -v \
          --cov=app \
          --cov-report=xml \
          --junit-xml=integration-test-results.xml \
          -m "integration"
    
    - name: Upload integration test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: integration-test-results
        path: |
          backend/integration-test-results.xml
          backend/coverage.xml

  api-tests:
    name: API Endpoint Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      id: setup-python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: ${{ env.POETRY_VERSION }}
        virtualenvs-create: true
        virtualenvs-in-project: true
    
    - name: Install dependencies
      working-directory: backend
      run: |
        poetry install --with dev,test
    
    - name: Run API endpoint tests
      working-directory: backend
      run: |
        poetry run pytest tests/ -v \
          --junit-xml=api-test-results.xml \
          -m "api or auth"
    
    - name: Upload API test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: api-test-results
        path: backend/api-test-results.xml

  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: integration-tests
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      id: setup-python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: ${{ env.POETRY_VERSION }}
        virtualenvs-create: true
        virtualenvs-in-project: true
    
    - name: Install dependencies
      working-directory: backend
      run: |
        poetry install --with dev,test
    
    - name: Run performance tests
      working-directory: backend
      run: |
        poetry run pytest tests/ -v \
          --junit-xml=performance-test-results.xml \
          -m "performance"
    
    - name: Upload performance test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: performance-test-results
        path: backend/performance-test-results.xml

  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests, api-tests]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      working-directory: deploy/docker
      run: |
        docker build -t requify-backend:latest -f backend/Dockerfile.prod ../../backend
    
    - name: Run container health check
      run: |
        docker run -d --name test-container -p 8000:8000 requify-backend:latest
        sleep 30
        curl -f http://localhost:8000/health || exit 1
        docker stop test-container
        docker rm test-container
    
    - name: Generate deployment summary
      run: |
        echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Image**: requify-backend:latest" >> $GITHUB_STEP_SUMMARY
        echo "- **Status**: ✅ Successfully built and tested" >> $GITHUB_STEP_SUMMARY

  notification:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests, integration-tests, api-tests]
    if: always()
    
    steps:
    - name: Generate status report
      run: |
        echo "## Backend CI/CD Pipeline Results" >> $GITHUB_STEP_SUMMARY
        echo "- **Code Quality**: ${{ needs.code-quality.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Unit Tests**: ${{ needs.unit-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Integration Tests**: ${{ needs.integration-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **API Tests**: ${{ needs.api-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
