name: Backend CI/CD

on:
  push:
    branches: [ main, develop, dev ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, develop, dev ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:
    inputs:
      submodule_ref:
        description: 'Backend submodule reference to test'
        required: false
        default: 'main'
        type: string

env:
  PYTHON_VERSION: '3.13'
  POETRY_VERSION: '1.8.3'

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Update backend submodule
      if: github.event.inputs.submodule_ref != ''
      run: |
        cd backend
        git fetch origin ${{ github.event.inputs.submodule_ref }}
        git checkout ${{ github.event.inputs.submodule_ref }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache Poetry installation
      uses: actions/cache@v4
      with:
        path: ~/.local
        key: poetry-${{ env.POETRY_VERSION }}-${{ runner.os }}

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: ${{ env.POETRY_VERSION }}
        virtualenvs-create: true
        virtualenvs-in-project: true
        installer-parallel: true

    - name: Cache dependencies
      id: cache-deps
      uses: actions/cache@v4
      with:
        path: backend/.venv
        key: pydeps-${{ hashFiles('backend/pyproject.toml') }}-${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      if: steps.cache-deps.outputs.cache-hit != 'true'
      working-directory: ./backend
      run: poetry install --no-interaction --no-ansi

    - name: Run Black (Code Formatting Check)
      working-directory: ./backend
      run: |
        poetry run black --check --diff .
      continue-on-error: false

    - name: Run isort (Import Sorting Check)
      working-directory: ./backend
      run: |
        poetry run isort --check-only --diff .
      continue-on-error: false

    - name: Run Flake8 (Style Guide Enforcement)
      working-directory: ./backend
      run: |
        poetry run flake8 --config=setup.cfg .
      continue-on-error: false

    - name: Run Pylint (Static Code Analysis)
      working-directory: ./backend
      run: |
        poetry run pylint app/ --rcfile=.pylintrc --output-format=text --reports=no --score=no
      continue-on-error: true  # Pylint warnings shouldn't fail CI

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint  # Tests only run if linting passes
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_requify
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Update backend submodule
      if: github.event.inputs.submodule_ref != ''
      run: |
        cd backend
        git fetch origin ${{ github.event.inputs.submodule_ref }}
        git checkout ${{ github.event.inputs.submodule_ref }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache Poetry installation
      uses: actions/cache@v4
      with:
        path: ~/.local
        key: poetry-${{ env.POETRY_VERSION }}-${{ runner.os }}

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: ${{ env.POETRY_VERSION }}
        virtualenvs-create: true
        virtualenvs-in-project: true
        installer-parallel: true

    - name: Cache dependencies
      id: cache-deps
      uses: actions/cache@v4
      with:
        path: backend/.venv
        key: pydeps-${{ hashFiles('backend/pyproject.toml') }}-${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      if: steps.cache-deps.outputs.cache-hit != 'true'
      working-directory: ./backend
      run: poetry install --no-interaction --no-ansi

    - name: Set up test environment
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_requify
        TEST_DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_requify
        REDIS_URL: redis://localhost:6379/0
        SECRET_KEY: test-secret-key-for-ci
        ALGORITHM: HS256
        ACCESS_TOKEN_EXPIRE_MINUTES: 30
        TESTING: true
      run: |
        # Create test environment file
        cat > .env.test << EOF
        DATABASE_URL=postgresql+asyncpg://test_user:test_password@localhost:5432/test_requify
        TEST_DATABASE_URL=postgresql+asyncpg://test_user:test_password@localhost:5432/test_requify
        REDIS_URL=redis://localhost:6379/0
        SECRET_KEY=test-secret-key-for-ci
        ALGORITHM=HS256
        ACCESS_TOKEN_EXPIRE_MINUTES=30
        TESTING=true
        EOF

    - name: Wait for services
      run: |
        sleep 10

    - name: Run database migrations
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_requify
      run: |
        poetry run alembic upgrade head

    - name: Run unit tests
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_requify
        TEST_DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_requify
        REDIS_URL: redis://localhost:6379/0
        SECRET_KEY: test-secret-key-for-ci
        TESTING: true
      run: |
        poetry run pytest tests/ -v \
          --tb=short \
          --cov=app \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term-missing \
          --cov-fail-under=80 \
          -m "unit" \
          --maxfail=5

    - name: Run integration tests
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_requify
        TEST_DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_requify
        REDIS_URL: redis://localhost:6379/0
        SECRET_KEY: test-secret-key-for-ci
        TESTING: true
      run: |
        poetry run pytest tests/ -v \
          --tb=short \
          --cov=app \
          --cov-append \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term-missing \
          -m "integration" \
          --maxfail=3
      continue-on-error: true  # Integration tests can be flaky

    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      if: always()
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./backend/coverage.xml
        directory: ./backend/htmlcov
        flags: backend
        name: backend-coverage
        fail_ci_if_error: false

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          backend/coverage.xml
          backend/htmlcov/
          backend/pytest.xml
        retention-days: 7

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Update backend submodule
      if: github.event.inputs.submodule_ref != ''
      run: |
        cd backend
        git fetch origin ${{ github.event.inputs.submodule_ref }}
        git checkout ${{ github.event.inputs.submodule_ref }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: ${{ env.POETRY_VERSION }}

    - name: Install dependencies
      working-directory: ./backend
      run: poetry install --no-interaction --no-ansi

    - name: Run Safety (Security vulnerabilities check)
      working-directory: ./backend
      run: |
        poetry run pip install safety
        poetry run safety check --json --output safety-report.json || true
      continue-on-error: true

    - name: Upload security report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-report
        path: backend/safety-report.json
        retention-days: 7

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: always() && (needs.lint.result == 'success')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Update backend submodule
      if: github.event.inputs.submodule_ref != ''
      run: |
        cd backend
        git fetch origin ${{ github.event.inputs.submodule_ref }}
        git checkout ${{ github.event.inputs.submodule_ref }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: ${{ env.POETRY_VERSION }}

    - name: Build package
      working-directory: ./backend
      run: |
        poetry build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: backend/dist/
        retention-days: 7

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [lint, test, security-scan, build-check]
    if: always()
    
    steps:
    - name: Check workflow status
      run: |
        echo "Lint result: ${{ needs.lint.result }}"
        echo "Test result: ${{ needs.test.result }}"
        echo "Security scan result: ${{ needs.security-scan.result }}"
        echo "Build check result: ${{ needs.build-check.result }}"
        
        if [ "${{ needs.lint.result }}" != "success" ]; then
          echo "❌ Linting failed - check code formatting and style"
          exit 1
        fi
        
        if [ "${{ needs.test.result }}" != "success" ]; then
          echo "⚠️ Tests failed - check test results"
        fi
        
        echo "✅ Backend CI/CD pipeline completed"
