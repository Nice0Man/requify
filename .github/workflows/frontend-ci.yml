name: Frontend CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:
    inputs:
      submodule_ref:
        description: 'Frontend submodule reference to test'
        required: false
        default: 'main'
        type: string
      debug_enabled:
        description: 'Enable debug mode'
        required: false
        default: 'false'
        type: boolean

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Update frontend submodule
      if: github.event.inputs.submodule_ref != ''
      run: |
        cd frontend
        git fetch origin ${{ github.event.inputs.submodule_ref }}
        git checkout ${{ github.event.inputs.submodule_ref }}
      with:
        fetch-depth: 0
        submodules: recursive
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Update frontend submodule
      if: github.event.inputs.submodule_ref != ''
      run: |
        cd frontend
        git fetch origin ${{ github.event.inputs.submodule_ref }}
        git checkout ${{ github.event.inputs.submodule_ref }}
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
    
    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: ${{ env.PNPM_VERSION }}
        run_install: false
    
    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
    
    - name: Cache pnpm dependencies
      uses: actions/cache@v4
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-
    
    - name: Install dependencies
      working-directory: frontend
      run: pnpm install --frozen-lockfile
    
    - name: TypeScript type checking
      working-directory: frontend
      run: pnpm run type-check
    
    - name: ESLint checking
      working-directory: frontend
      run: pnpm run lint
    
    - name: Prettier formatting check
      working-directory: frontend
      run: pnpm run format:check
    
    - name: Check for circular dependencies
      working-directory: frontend
      run: |
        npx madge --circular --extensions ts,tsx src/
    
    - name: Bundle analyzer
      working-directory: frontend
      run: |
        pnpm run build
        npx vite-bundle-analyzer dist/

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: code-quality
    
    strategy:
      matrix:
        node-version: ['16', '18', '20']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Update frontend submodule
      if: github.event.inputs.submodule_ref != ''
      run: |
        cd frontend
        git fetch origin ${{ github.event.inputs.submodule_ref }}
        git checkout ${{ github.event.inputs.submodule_ref }}
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    
    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: ${{ env.PNPM_VERSION }}
        run_install: false
    
    - name: Install dependencies
      working-directory: frontend
      run: pnpm install --frozen-lockfile
    
    - name: Run unit tests
      working-directory: frontend
      run: |
        pnpm run test:unit --coverage --reporter=json --reporter=html
    
    - name: Upload test coverage
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report-${{ matrix.node-version }}
        path: |
          frontend/coverage/
          frontend/test-results/

  component-tests:
    name: Component Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Update frontend submodule
      if: github.event.inputs.submodule_ref != ''
      run: |
        cd frontend
        git fetch origin ${{ github.event.inputs.submodule_ref }}
        git checkout ${{ github.event.inputs.submodule_ref }}
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
    
    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: ${{ env.PNPM_VERSION }}
        run_install: false
    
    - name: Install dependencies
      working-directory: frontend
      run: pnpm install --frozen-lockfile
    
    - name: Install Playwright browsers
      working-directory: frontend
      run: npx playwright install --with-deps
    
    - name: Run component tests
      working-directory: frontend
      run: |
        pnpm run test:component
    
    - name: Upload component test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: component-test-results
        path: |
          frontend/test-results/
          frontend/playwright-report/

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: component-tests
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Update frontend submodule
      if: github.event.inputs.submodule_ref != ''
      run: |
        cd frontend
        git fetch origin ${{ github.event.inputs.submodule_ref }}
        git checkout ${{ github.event.inputs.submodule_ref }}
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
    
    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: ${{ env.PNPM_VERSION }}
        run_install: false
    
    - name: Install dependencies
      working-directory: frontend
      run: pnpm install --frozen-lockfile
    
    - name: Install Playwright browsers
      working-directory: frontend
      run: npx playwright install --with-deps
    
    - name: Build application
      working-directory: frontend
      run: pnpm run build
    
    - name: Start preview server
      working-directory: frontend
      run: |
        pnpm run preview &
        sleep 10
    
    - name: Run E2E tests
      working-directory: frontend
      run: |
        pnpm run test:e2e
    
    - name: Upload E2E test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: e2e-test-results
        path: |
          frontend/test-results/
          frontend/playwright-report/

  accessibility-tests:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Update frontend submodule
      if: github.event.inputs.submodule_ref != ''
      run: |
        cd frontend
        git fetch origin ${{ github.event.inputs.submodule_ref }}
        git checkout ${{ github.event.inputs.submodule_ref }}
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
    
    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: ${{ env.PNPM_VERSION }}
        run_install: false
    
    - name: Install dependencies
      working-directory: frontend
      run: pnpm install --frozen-lockfile
    
    - name: Build application
      working-directory: frontend
      run: pnpm run build
    
    - name: Run accessibility audit
      working-directory: frontend
      run: |
        npx @axe-core/cli dist/ --exit
    
    - name: Lighthouse CI
      working-directory: frontend
      run: |
        npm install -g @lhci/cli
        lhci autorun

  visual-regression:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    needs: component-tests
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Update frontend submodule
      if: github.event.inputs.submodule_ref != ''
      run: |
        cd frontend
        git fetch origin ${{ github.event.inputs.submodule_ref }}
        git checkout ${{ github.event.inputs.submodule_ref }}
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
    
    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: ${{ env.PNPM_VERSION }}
        run_install: false
    
    - name: Install dependencies
      working-directory: frontend
      run: pnpm install --frozen-lockfile
    
    - name: Run visual regression tests
      working-directory: frontend
      run: |
        pnpm run test:visual
    
    - name: Upload visual test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: visual-test-results
        path: |
          frontend/visual-test-results/

  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests, component-tests]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Update frontend submodule
      if: github.event.inputs.submodule_ref != ''
      run: |
        cd frontend
        git fetch origin ${{ github.event.inputs.submodule_ref }}
        git checkout ${{ github.event.inputs.submodule_ref }}
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
    
    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: ${{ env.PNPM_VERSION }}
        run_install: false
    
    - name: Install dependencies
      working-directory: frontend
      run: pnpm install --frozen-lockfile
    
    - name: Build for production
      working-directory: frontend
      env:
        VITE_API_URL: ${{ secrets.VITE_API_URL }}
        VITE_APP_VERSION: ${{ github.sha }}
      run: |
        pnpm run build
    
    - name: Generate build analysis
      working-directory: frontend
      run: |
        npx vite-bundle-analyzer dist/ --mode json > build-analysis.json
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      working-directory: deploy/docker
      run: |
        docker build -t requify-frontend:latest -f frontend/Dockerfile.prod ../../frontend
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: |
          frontend/dist/
          frontend/build-analysis.json
    
    - name: Generate deployment summary
      run: |
        echo "## Frontend Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Image**: requify-frontend:latest" >> $GITHUB_STEP_SUMMARY
        echo "- **Status**: ✅ Successfully built and tested" >> $GITHUB_STEP_SUMMARY

  notification:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests, component-tests, e2e-tests, accessibility-tests]
    if: always()
    
    steps:
    - name: Generate status report
      run: |
        echo "## Frontend CI/CD Pipeline Results" >> $GITHUB_STEP_SUMMARY
        echo "- **Code Quality**: ${{ needs.code-quality.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Unit Tests**: ${{ needs.unit-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Component Tests**: ${{ needs.component-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **E2E Tests**: ${{ needs.e2e-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Accessibility Tests**: ${{ needs.accessibility-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
