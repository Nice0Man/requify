<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Requify - Modern Requirements Management System for teams and organizations" />
    <meta name="theme-color" content="#1976d2" />
    <meta name="robots" content="noindex, nofollow" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- Preconnect to Google Fonts for better performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Title -->
    <title>Requify - Requirements Management System</title>
    
    <!-- CRITICAL: Hide scrollbars immediately before any content loads -->
    <style>
      /* Hide scrollbars for all browsers - HIGHEST PRIORITY */
      html, body, #root, *, div, section, main, article, aside, nav, header, footer {
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
      }
      
      html::-webkit-scrollbar, body::-webkit-scrollbar, #root::-webkit-scrollbar,
      *::-webkit-scrollbar, div::-webkit-scrollbar, section::-webkit-scrollbar,
      main::-webkit-scrollbar, article::-webkit-scrollbar, aside::-webkit-scrollbar,
      nav::-webkit-scrollbar, header::-webkit-scrollbar, footer::-webkit-scrollbar {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
        background: transparent !important;
        -webkit-appearance: none !important;
      }
      
      html::-webkit-scrollbar-track, body::-webkit-scrollbar-track, #root::-webkit-scrollbar-track,
      *::-webkit-scrollbar-track {
        display: none !important;
        background: transparent !important;
      }
      
      html::-webkit-scrollbar-thumb, body::-webkit-scrollbar-thumb, #root::-webkit-scrollbar-thumb,
      *::-webkit-scrollbar-thumb {
        display: none !important;
        background: transparent !important;
      }
      
      html::-webkit-scrollbar-corner, body::-webkit-scrollbar-corner, #root::-webkit-scrollbar-corner,
      *::-webkit-scrollbar-corner {
        display: none !important;
        background: transparent !important;
      }
      
      /* Base styles */
      html {
        height: 100%;
        overflow-x: hidden;
        overflow-y: auto;
      }
      
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        overflow-y: auto;
      }
      
      #root {
        min-height: 100vh;
        background-color: #ffffff;
        overflow-x: hidden;
        overflow-y: auto;
      }
      
      /* Loading spinner for initial load */
      .initial-loading {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 9999;
      }
      
      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #f3f3f3;
        border-top: 4px solid #1976d2;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Fallback loading spinner -->
      <div class="initial-loading">
        <div class="loading-spinner"></div>
      </div>
    </div>
    
    <!-- Main application entry point -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
